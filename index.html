<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Platinum 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#000;color:#f5f5f7;padding:25px 14px;}
.container{max-width:480px;margin:auto;}
h1{text-align:center;margin-bottom:25px;font-size:26px;}

.card{
background:#1c1c1e;
border-radius:20px;
padding:18px;
margin-bottom:18px;
}

label{font-size:12px;opacity:.6;margin-top:14px;display:block;margin-bottom:6px;}

input,select{
width:100%;
padding:12px;
border-radius:12px;
border:none;
background:#2c2c2e;
color:#fff;
font-size:14px;
}

button{
width:100%;
padding:12px;
border-radius:12px;
border:none;
margin-top:10px;
font-weight:600;
cursor:pointer;
}

.btn-primary{background:#0a84ff;color:#fff;}
.btn-success{background:#30d158;color:#000;}
.btn-warning{background:#ff9f0a;color:#000;}
.btn-dark{background:#3a3a3c;color:#fff;}
.btn-gold{background:#ffd60a;color:#000;}
.btn-danger{background:#2c2c2e;color:#ff453a;}
.btn-delete-project{background:#ff453a;color:#fff;}

.flex{display:flex;flex-direction:column;gap:8px;}

.kategori-card{
background:#2c2c2e;
border-radius:16px;
padding:14px;
margin-top:14px;
position:relative;
}

.btn-delete-kategori{
position:absolute;
top:10px;
right:10px;
background:#3a3a3c;
color:#ff453a;
padding:4px 10px;
border-radius:20px;
font-size:11px;
}

table{width:100%;border-spacing:0 6px;margin-top:10px;}
th{display:none;}
td{
display:block;
background:#1c1c1e;
padding:10px;
border-radius:12px;
margin-bottom:5px;
font-size:13px;
}
td:before{
content:attr(data-label);
display:block;
font-size:11px;
opacity:.5;
margin-bottom:4px;
}

.edit-input{
width:100%;
background:#2c2c2e;
border:none;
border-radius:8px;
padding:6px;
color:#fff;
}

.summary-card{
background:#2c2c2e;
padding:14px;
border-radius:16px;
margin-top:16px;
}

.toggle-modern{
display:flex;
justify-content:space-between;
align-items:center;
background:#1c1c1e;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.total-box{margin-top:6px;font-size:13px;}

canvas{margin-top:10px;}
</style>
</head>
<body>

<div class="container">
<h1>RAB Platinum 2026</h1>

<div class="card">
<label>Nama Project</label>
<input type="text" id="projectName">
<button class="btn-delete-project" onclick="deleteProject()">Delete Project</button>

<label>Pilih Template</label>
<select id="templateSelect">
<option value="travel_liburan">Travel Liburan</option>
<option value="travel_dinas">Travel Dinas</option>
<option value="travel_umroh">Travel Umroh</option>
<option value="travel_corporate">Corporate Trip</option>
<option value="custom">Custom</option>
</select>

<button class="btn-primary" onclick="applyTemplate()">Gunakan Template</button>

<label>Tambah Kategori</label>
<input type="text" id="kategoriInput">
<button class="btn-success" onclick="addKategori()">Tambah</button>

<div id="kategoriContainer"></div>

<div class="toggle-modern">
<span>PPN 11%</span>
<input type="checkbox" id="ppnToggle" checked onchange="render()">
</div>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0" onchange="render()">

<label>Margin Profit (%)</label>
<input type="number" id="marginInput" value="20" onchange="render()">

<div id="summary"></div>

<div class="flex">
<button class="btn-warning" onclick="exportPDF()">Export PDF</button>
<button class="btn-gold" onclick="exportExcel()">Export Excel</button>
<button class="btn-dark" onclick="generateLink()">Generate Link</button>
</div>

<div id="generatedLink"></div>
</div>

<div class="card">
<h3>Grafik Analisa</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>

let data={}
let chartInstance=null
let diskonAktif=true
let profitAktif=true

function formatRp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function clean(n){return Number(String(n).replace(/\D/g,''))}
function safeKey(k){return k.replace(/\s+/g,'_').replace(/[^\w]/g,'')}

function deleteProject(){
if(confirm("Hapus seluruh project?")){
data={}
projectName.value=""
render()
}
}

function applyTemplate(){
let t=templateSelect.value
const templates={
travel_liburan:{
"Transportasi":[{nama:"Tiket Pesawat PP",volume:1,harga:7500000}],
"Akomodasi":[{nama:"Hotel 5 Malam",volume:5,harga:1200000}]
},
travel_dinas:{
"Transportasi":[{nama:"Tiket Pesawat",volume:1,harga:3500000}]
},
travel_umroh:{
"Paket Umroh":[{nama:"Paket 9 Hari",volume:1,harga:35000000}]
},
travel_corporate:{
"Transportasi":[{nama:"Bus Pariwisata",volume:1,harga:12000000}]
}
}
data=templates[t]||{}
render()
}

function addKategori(){
let k=kategoriInput.value.trim()
if(!k)return
if(!data[k])data[k]=[]
kategoriInput.value=""
render()
}

function deleteKategori(k){
delete data[k]
render()
}

function addItem(k){
let key=safeKey(k)
let nama=document.getElementById("nama_"+key).value
let volume=clean(document.getElementById("vol_"+key).value)
let harga=clean(document.getElementById("harga_"+key).value)
if(!nama||!volume||!harga)return
data[k].push({nama,volume,harga})
render()
}

function deleteItem(k,i){
data[k].splice(i,1)
render()
}

function editItem(k,i,f,v){
if(f==="nama")data[k][i].nama=v
if(f==="volume")data[k][i].volume=clean(v)
if(f==="harga")data[k][i].harga=clean(v)
render()
}

function render(){
let container=kategoriContainer
container.innerHTML=""
let totalAll=0

Object.keys(data).forEach(k=>{
let key=safeKey(k)
let total=0

let html=`<div class="kategori-card">
<button class="btn-delete-kategori" onclick="deleteKategori('${k}')">Delete</button>
<h3>${k}</h3>

<div class="flex">
<input id="nama_${key}" placeholder="Nama Item">
<input id="vol_${key}" placeholder="Volume">
<input id="harga_${key}" placeholder="Harga">
<button class="btn-primary" onclick="addItem('${k}')">Tambah</button>
</div>

<table>`

data[k].forEach((it,i)=>{
let sub=it.volume*it.harga
total+=sub
html+=`
<tr>
<td data-label="Nama"><input class="edit-input" value="${it.nama}" onchange="editItem('${k}',${i},'nama',this.value)"></td>
<td data-label="Volume"><input class="edit-input" value="${it.volume}" onchange="editItem('${k}',${i},'volume',this.value)"></td>
<td data-label="Harga"><input class="edit-input" value="${it.harga}" onchange="editItem('${k}',${i},'harga',this.value)"></td>
<td data-label="Subtotal">${formatRp(sub)}</td>
<td data-label="Aksi"><button class="btn-danger" onclick="deleteItem('${k}',${i})">Hapus</button></td>
</tr>`
})

totalAll+=total
html+=`</table>
<div class="total-box">Total ${k}: ${formatRp(total)}</div>
</div>`

container.innerHTML+=html
})

let diskon=diskonAktif?totalAll*(diskonInput.value/100):0
let subtotal=totalAll-diskon
let ppn=ppnToggle.checked?subtotal*0.11:0
let grand=subtotal+ppn
let profit=profitAktif?grand*(marginInput.value/100):0

summary.innerHTML=`
<div class="summary-card">
<div class="toggle-modern">
<span>Diskon</span>
<input type="checkbox" ${diskonAktif?"checked":""} onchange="diskonAktif=this.checked;render()">
</div>
<div class="toggle-modern">
<span>Profit</span>
<input type="checkbox" ${profitAktif?"checked":""} onchange="profitAktif=this.checked;render()">
</div>
<div class="total-box">Subtotal: ${formatRp(totalAll)}</div>
<div class="total-box">Diskon: ${formatRp(diskon)}</div>
<div class="total-box">PPN: ${formatRp(ppn)}</div>
<div class="total-box">Grand Total: ${formatRp(grand)}</div>
<div class="total-box">Profit: ${formatRp(profit)}</div>
</div>`

renderChart(grand,profit)
}

function renderChart(total,profit){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(document.getElementById("chart"),{
type:"bar",
data:{labels:["Grand Total","Profit"],
datasets:[{data:[total,profit]}]},
options:{plugins:{legend:{display:false}}}
})
}

function exportPDF(){html2pdf().from(document.body).save("RAB.pdf")}
function exportExcel(){
let wb=XLSX.utils.book_new()
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]]
Object.keys(data).forEach(k=>{
data[k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga])
})
})
let ws=XLSX.utils.aoa_to_sheet(rows)
XLSX.utils.book_append_sheet(wb,ws,"RAB")
XLSX.writeFile(wb,"RAB.xlsx")
}

function generateLink(){
let encoded=btoa(JSON.stringify(data))
generatedLink.innerHTML=`<div class="link-box">${location.origin+location.pathname+"?data="+encoded}</div>`
}

window.onload=function(){
let params=new URLSearchParams(window.location.search)
if(params.get("data")){
data=JSON.parse(atob(params.get("data")))
}
render()
}

</script>
</body>
</html>
