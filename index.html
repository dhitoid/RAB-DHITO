<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB PRO 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
background:linear-gradient(135deg,#0f172a,#020617);
color:#fff;
min-height:100vh;
display:flex;
}
.sidebar{
width:260px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(20px);
padding:20px;
border-right:1px solid rgba(255,255,255,0.05);
}
.sidebar h2{margin-bottom:15px}
.project-item{
padding:10px;
background:rgba(255,255,255,0.06);
border-radius:10px;
margin-bottom:8px;
cursor:pointer;
font-size:13px;
}
.project-item.active{background:#0ea5e9}
.main{
flex:1;
padding:30px;
max-width:1000px;
margin:auto;
}
.card{
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:20px;
margin-bottom:20px;
}
input,select{
width:100%;
padding:10px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.1);
color:#fff;
margin-top:6px;
}
button{
padding:10px 14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
margin-top:8px;
}
.btn-primary{background:#0ea5e9;color:#fff}
.btn-success{background:#22c55e;color:#000}
.btn-danger{background:#ef4444;color:#fff}
.btn-warning{background:#f59e0b;color:#000}
.btn-dark{background:#1e293b;color:#fff}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
font-size:13px;
}
th,td{
padding:8px;
border-bottom:1px solid rgba(255,255,255,0.1);
text-align:left;
}
th{opacity:.7}

.summary-box{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:15px;
margin-top:15px;
}
.flex{display:flex;gap:10px;flex-wrap:wrap}
canvas{margin-top:15px}
.link-box{
background:rgba(255,255,255,0.1);
padding:10px;
border-radius:10px;
font-size:12px;
word-break:break-all;
margin-top:10px;
}
</style>
</head>
<body>

<div class="sidebar">
<h2>📁 Projects</h2>
<div id="projectList"></div>

<input id="newProjectName" placeholder="Project baru">
<button class="btn-primary" onclick="createProject()">Tambah Project</button>
</div>

<div class="main">

<h1>RAB PRO 2026</h1>

<div class="card">
<label>Nama Project</label>
<input id="projectName">

<label>Tambah Kategori</label>
<input id="kategoriInput">
<button class="btn-success" onclick="addKategori()">Tambah</button>

<div id="kategoriContainer"></div>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0">

<label>Margin (%)</label>
<input type="number" id="marginInput" value="20">

<div id="summary" class="summary-box"></div>

<div class="flex">
<button class="btn-warning" onclick="exportPDF()">Export PDF</button>
<button class="btn-primary" onclick="exportExcel()">Export Excel</button>
<button class="btn-dark" onclick="generateLink()">Generate Link</button>
</div>

<div id="generatedLink"></div>
</div>

<div class="card">
<h3>Analisa Biaya</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>

let projects=JSON.parse(localStorage.getItem("rab_projects")||"{}")
let currentProject=null
let chartInstance=null

function saveStorage(){
localStorage.setItem("rab_projects",JSON.stringify(projects))
}

function createProject(){
let name=document.getElementById("newProjectName").value.trim()
if(!name)return
projects[name]={kategori:{},diskon:0,margin:20}
currentProject=name
saveStorage()
renderProjects()
render()
document.getElementById("newProjectName").value=""
}

function renderProjects(){
let list=document.getElementById("projectList")
list.innerHTML=""
Object.keys(projects).forEach(p=>{
list.innerHTML+=`<div class="project-item ${p===currentProject?"active":""}" onclick="selectProject('${p}')">${p}</div>`
})
}

function selectProject(p){
currentProject=p
renderProjects()
render()
}

function addKategori(){
let k=document.getElementById("kategoriInput").value.trim()
if(!k)return
projects[currentProject].kategori[k]=[]
saveStorage()
render()
document.getElementById("kategoriInput").value=""
}

function addItem(k){
let nama=prompt("Nama Item")
let volume=Number(prompt("Volume"))
let harga=Number(prompt("Harga"))
if(!nama||!volume||!harga)return
projects[currentProject].kategori[k].push({nama,volume,harga})
saveStorage()
render()
}

function deleteItem(k,i){
projects[currentProject].kategori[k].splice(i,1)
saveStorage()
render()
}

function formatRp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}

function render(){
if(!currentProject)return
let p=projects[currentProject]
document.getElementById("projectName").value=currentProject
document.getElementById("diskonInput").value=p.diskon
document.getElementById("marginInput").value=p.margin

let container=document.getElementById("kategoriContainer")
container.innerHTML=""
let subtotal=0

Object.keys(p.kategori).forEach(k=>{
let total=0
let html=`<div class="card"><h3>${k}</h3>
<button class="btn-primary" onclick="addItem('${k}')">Tambah Item</button>
<table>
<tr><th>Nama</th><th>Vol</th><th>Harga</th><th>Subtotal</th><th></th></tr>`
p.kategori[k].forEach((it,i)=>{
let sub=it.volume*it.harga
total+=sub
html+=`<tr>
<td>${it.nama}</td>
<td>${it.volume}</td>
<td>${formatRp(it.harga)}</td>
<td>${formatRp(sub)}</td>
<td><button class="btn-danger" onclick="deleteItem('${k}',${i})">X</button></td>
</tr>`
})
html+=`</table><strong>Total: ${formatRp(total)}</strong></div>`
subtotal+=total
container.innerHTML+=html
})

p.diskon=Number(document.getElementById("diskonInput").value)
p.margin=Number(document.getElementById("marginInput").value)

let diskon=subtotal*(p.diskon/100)
let grand=subtotal-diskon
let profit=grand*(p.margin/100)

document.getElementById("summary").innerHTML=
`Subtotal: ${formatRp(subtotal)}<br>
Diskon: ${formatRp(diskon)}<br>
<strong>Grand Total: ${formatRp(grand)}</strong><br>
Profit: ${formatRp(profit)}`

saveStorage()
renderChart(subtotal,profit)
}

function renderChart(total,profit){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels:["Biaya","Profit"],
datasets:[{data:[total,profit]}]
},
options:{plugins:{legend:{labels:{color:"#fff"}}}}
})
}

function exportPDF(){
html2pdf().from(document.body).save(currentProject+"_RAB.pdf")
}

function exportExcel(){
let p=projects[currentProject]
let wb=XLSX.utils.book_new()
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]]
Object.keys(p.kategori).forEach(k=>{
p.kategori[k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga])
})
})
let ws=XLSX.utils.aoa_to_sheet(rows)
XLSX.utils.book_append_sheet(wb,ws,"RAB")
XLSX.writeFile(wb,currentProject+"_RAB.xlsx")
}

function generateLink(){
let encoded=btoa(JSON.stringify(projects[currentProject]))
let url=location.origin+location.pathname+"?data="+encoded
document.getElementById("generatedLink").innerHTML=`<div class="link-box">${url}</div>`
}

window.onload=()=>{
let params=new URLSearchParams(location.search)
if(params.get("data")){
let imported=JSON.parse(atob(params.get("data")))
projects["Imported Project"]=imported
currentProject="Imported Project"
saveStorage()
}
renderProjects()
if(Object.keys(projects).length>0){
currentProject=Object.keys(projects)[0]
}
render()
}
</script>

</body>
</html>
