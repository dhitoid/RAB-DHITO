<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB PRO 2026 - Commercial</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:linear-gradient(135deg,#0b1220,#0f172a);
color:#e5e7eb;
min-height:100vh;
}

/* ================= HEADER ================= */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 35px;
background:rgba(15,23,42,.8);
backdrop-filter:blur(14px);
border-bottom:1px solid rgba(255,255,255,.05);
position:sticky;
top:0;
z-index:100;
}

h1{
font-size:18px;
font-weight:600;
letter-spacing:.5px;
color:#fff;
}

/* ================= LAYOUT ================= */
.wrapper{
display:flex;
max-width:1700px;
margin:auto;
padding:30px;
gap:30px;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:270px;
background:#0f172a;
border:1px solid rgba(255,255,255,.05);
border-radius:20px;
padding:22px;
box-shadow:0 20px 40px rgba(0,0,0,.5);
}

.sidebar h3{
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
color:#64748b;
margin-bottom:15px;
}

.project-item{
padding:12px 14px;
border-radius:12px;
margin-bottom:8px;
cursor:pointer;
font-size:14px;
background:rgba(255,255,255,.03);
transition:.25s;
border:1px solid transparent;
}

.project-item.active{
background:rgba(14,165,233,.15);
border:1px solid #0ea5e9;
color:#0ea5e9;
}

.project-item:hover{
background:rgba(255,255,255,.07);
transform:translateX(3px);
}

/* ================= MAIN ================= */
.main{
flex:1;
}

/* ================= CARD ================= */
.card{
background:#111827;
border:1px solid rgba(255,255,255,.05);
border-radius:22px;
padding:28px;
margin-bottom:28px;
box-shadow:0 25px 60px rgba(0,0,0,.6);
transition:.3s;
}

.card:hover{
transform:translateY(-2px);
}

/* ================= BUTTON ================= */
button{
border:none;
padding:10px 16px;
border-radius:12px;
cursor:pointer;
font-weight:600;
font-size:13px;
transition:.25s;
}

.btn-primary{background:#0ea5e9;color:#fff}
.btn-success{background:#22c55e;color:#000}
.btn-danger{background:#ef4444;color:#fff}
.btn-warning{background:#f59e0b;color:#000}

button:hover{
transform:translateY(-2px);
opacity:.9;
}

/* ================= INPUT ================= */
input{
width:100%;
background:#0b1220;
border:1px solid rgba(255,255,255,.08);
color:#fff;
padding:12px;
border-radius:12px;
outline:none;
font-size:14px;
transition:.25s;
}

input:focus{
border-color:#0ea5e9;
box-shadow:0 0 0 2px rgba(14,165,233,.2);
}

/* ================= TABLE ================= */
.table-wrap{
overflow-x:auto;
margin-top:20px;
border-radius:18px;
border:1px solid rgba(255,255,255,.05);
}

table{
width:100%;
border-collapse:collapse;
min-width:720px;
background:#0b1220;
}

th{
text-align:left;
padding:16px;
font-size:11px;
text-transform:uppercase;
letter-spacing:1px;
background:#0f172a;
color:#64748b;
border-bottom:1px solid rgba(255,255,255,.05);
}

td{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.04);
font-size:14px;
}

tr:hover{
background:rgba(14,165,233,.05);
}

td:nth-child(2),
td:nth-child(3),
td:nth-child(4){
text-align:right;
}

td:nth-child(4){
font-weight:700;
color:#22c55e;
font-size:15px;
}

th:first-child, td:first-child{
min-width:220px;
}

td input[type="number"]{
text-align:right;
}

/* ================= SUMMARY PRO ================= */
.summary{
margin-top:25px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:18px;
}

.summary-box{
background:#0f172a;
padding:18px;
border-radius:16px;
border:1px solid rgba(255,255,255,.05);
}

.summary-box small{
color:#64748b;
font-size:12px;
}

.summary-box strong{
display:block;
margin-top:6px;
font-size:18px;
font-weight:700;
}

.summary-box.total{
border:1px solid #22c55e;
}

.summary-box.total strong{
color:#22c55e;
font-size:20px;
}

/* ================= SHIMMER ================= */
.shimmer{
height:120px;
border-radius:16px;
background:rgba(255,255,255,.05);
position:relative;
overflow:hidden;
margin-bottom:15px;
}

.shimmer::after{
content:"";
position:absolute;
top:0;
left:-150%;
width:150%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.15),
transparent
);
animation:shimmer 1.2s infinite;
}

/* ================= TAB SYSTEM ================= */

.tab-wrapper{
margin-top:20px;
}

.tab-nav{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.tab-btn{
padding:8px 14px;
border-radius:12px;
background:rgba(255,255,255,.05);
cursor:pointer;
font-size:13px;
border:1px solid transparent;
transition:.2s;
}

.tab-btn.active{
background:rgba(14,165,233,.15);
border:1px solid #0ea5e9;
color:#0ea5e9;
}

.tab-btn:hover{
background:rgba(255,255,255,.1);
}

.tab-content{
animation:fadeIn .25s ease-in-out;
}

/* ===== TAB PRO V2 ===== */

.tab-nav{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:18px;
}

.tab-btn{
display:flex;
align-items:center;
gap:8px;
padding:8px 14px;
border-radius:12px;
background:rgba(255,255,255,.04);
cursor:pointer;
font-size:13px;
border:1px solid transparent;
transition:.25s;
}

.tab-btn:hover{
background:rgba(255,255,255,.08);
}

.tab-btn.active{
background:rgba(14,165,233,.15);
border:1px solid #0ea5e9;
color:#0ea5e9;
}

.tab-badge{
background:#0ea5e9;
color:#fff;
font-size:11px;
padding:2px 7px;
border-radius:999px;
}

.tab-content{
animation:slideFade .25s ease;
}

@keyframes slideFade{
from{opacity:0;transform:translateX(10px)}
to{opacity:1;transform:translateX(0)}
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes shimmer{
100%{left:150%}
}

/* ================= MOBILE ================= */
@media(max-width:900px){
.wrapper{flex-direction:column}
.sidebar{width:100%}
}
</style>
</head>
<body>

<header>
<h1>💎 RAB PRO 2026 - Commercial</h1>
</header>

<div class="wrapper">

<!-- SIDEBAR -->
<div class="sidebar">
<h3 style="margin-bottom:10px">Projects</h3>
<div id="projectList"></div>

<input id="newProject" placeholder="Nama Project">
<button class="btn-primary" style="margin-top:10px;width:100%" onclick="createProject()">Tambah</button>
<button class="btn-danger" style="margin-top:8px;width:100%" onclick="deleteProject()">Hapus</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="card">
<label>Nama Project</label>
<input id="projectName" onblur="renameProject()">

<div style="margin-top:15px">
<label>Tambah Kategori</label>
<input id="newKategori">
<button class="btn-success" style="margin-top:8px" onclick="addKategori()">Tambah Kategori</button>
</div>

<div id="kategoriContainer"></div>

<h3 style="margin-top:20px">Pengaturan</h3>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin-top:10px">
<div>
<label>Diskon %</label>
<input type="number" id="diskon" oninput="updateSummary()">
</div>
<div>
<label>Margin %</label>
<input type="number" id="margin" oninput="updateSummary()">
</div>
<div>
<label>PPN %</label>
<input type="number" id="ppn" oninput="updateSummary()">
</div>
</div>

<div class="summary" id="summary"></div>

<button class="btn-warning" onclick="exportExcel()">Export Excel</button>

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>
</div>

<script>

/* ================= DATA ================= */
let projects = JSON.parse(localStorage.getItem("rab_pro_data") || "{}")
let currentProject = localStorage.getItem("rab_pro_current") || null
let activeTab = null
let chartInstance=null

function save(){
localStorage.setItem("rab_pro_data",JSON.stringify(projects))
localStorage.setItem("rab_pro_current",currentProject||"")
}

/* ================= FORMAT ================= */
function formatRp(val){
return new Intl.NumberFormat("id-ID").format(val)
}

function parseNumber(val){
return Number(val.replace(/\D/g,""))||0
}

/* ================= PROJECT ================= */
function createProject(){
let name=newProject.value.trim()
if(!name || projects[name]) return
projects[name]={
kategori:{},
diskon:0,
margin:20,
ppn:0
}
currentProject=name
newProject.value=""
save()
renderProjects()
render()
}

function deleteProject(){
if(!currentProject) return
delete projects[currentProject]
currentProject=null
save()
renderProjects()
render()
}

function renameProject(){
let val=projectName.value.trim()
if(!val || val===currentProject) return
if(projects[val]) return alert("Nama sudah ada")
projects[val]=projects[currentProject]
delete projects[currentProject]
currentProject=val
save()
renderProjects()
}

function selectProject(p){
currentProject=p
save()
renderProjects()
render()
}

function renderProjects(){
projectList.innerHTML=""
Object.keys(projects).forEach(p=>{
projectList.innerHTML+=`
<div class="project-item ${p===currentProject?"active":""}" onclick="selectProject('${p}')">${p}</div>
`
})
}

/* ================= KATEGORI ================= */
function addKategori(){
let k=newKategori.value.trim()
if(!k || !currentProject) return
projects[currentProject].kategori[k]=[]
newKategori.value=""
save()
render()
}

function deleteKategori(k){
delete projects[currentProject].kategori[k]
save()
render()
}

/* ================= ITEM ================= */
function addItem(k){
projects[currentProject].kategori[k].push({nama:"Item Baru",volume:1,harga:0})
save()
render()
}

function removeItem(k,i){
projects[currentProject].kategori[k].splice(i,1)
save()
render()
}

function updateItem(k,i,key,val){
if(key==="volume") projects[currentProject].kategori[k][i][key]=Number(val)||0
else projects[currentProject].kategori[k][i][key]=val
updateSummary()
save()
}

function updateHarga(k,i,input){
let number=parseNumber(input.value)
projects[currentProject].kategori[k][i].harga=number
input.value=formatRp(number)
updateSummary()
save()
}

function updateVolume(k,i,input){
let val=Number(input.value)||0
projects[currentProject].kategori[k][i].volume=val
updateSubtotalCell(k,i)
save()
}

function updateHargaRealtime(k,i,input){
let number=parseNumber(input.value)
projects[currentProject].kategori[k][i].harga=number
input.value=formatRp(number)
updateSubtotalCell(k,i)
save()
}

function updateSubtotalCell(k,i){
let item=projects[currentProject].kategori[k][i]
let subtotal=item.volume*item.harga

let cell=document.getElementById(`subtotal-${k}-${i}`)
if(cell){
cell.innerHTML="Rp "+formatRp(subtotal)
}

updateSummary()
}

function renderActiveTab(){
let p = projects[currentProject]
let tabContent = document.getElementById("tabContent")
if(!activeTab || !p.kategori[activeTab]){
tabContent.innerHTML = ""
return
}

let k = activeTab
let html = `
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
<h3 style="font-size:16px">${k}</h3>
<button class="btn-danger" onclick="deleteKategori('${k}')">Hapus</button>
</div>

<div class="table-wrap">
<table>
<tr>
<th>Nama</th>
<th style="width:90px">Volume</th>
<th style="width:140px">Harga</th>
<th style="width:160px">Subtotal</th>
<th style="width:60px"></th>
</tr>
`

p.kategori[k].forEach((it,i)=>{
html+=`
<tr>
<td>
<input value="${it.nama}" 
oninput="updateItem('${k}',${i},'nama',this.value)">
</td>

<td>
<input type="number" value="${it.volume}" 
oninput="updateVolume('${k}',${i},this)">
</td>

<td>
<input value="${formatRp(it.harga)}" 
oninput="updateHargaRealtime('${k}',${i},this)">
</td>

<td id="subtotal-${k}-${i}">
Rp ${formatRp(it.volume*it.harga)}
</td>

<td>
<button class="btn-danger" onclick="removeItem('${k}',${i})">X</button>
</td>
</tr>
`
})

html+=`
</table>
<button class="btn-success" style="margin-top:12px" onclick="addItem('${k}')">+ Item</button>
</div>
</div>
`

tabContent.innerHTML = html
}


/* ================= RENDER ================= */
function render(){
if(!currentProject) return

kategoriContainer.innerHTML = `
<div class="shimmer"></div>
<div class="shimmer"></div>
`

setTimeout(()=>{

let p = projects[currentProject]

projectName.value = currentProject
diskon.value = p.diskon
margin.value = p.margin
ppn.value = p.ppn

let kategoriKeys = Object.keys(p.kategori)

/* reset activeTab jika invalid */
if(!kategoriKeys.includes(activeTab)){
activeTab = kategoriKeys[0] || null
}

/* render tab wrapper */
kategoriContainer.innerHTML = `
<div class="tab-wrapper">
<div class="tab-nav" id="tabNav"></div>
<div class="tab-content" id="tabContent"></div>
</div>
`

let tabNav = document.getElementById("tabNav")

/* render tab button dengan badge */
kategoriKeys.forEach(k=>{
let btn = document.createElement("div")
btn.className = "tab-btn " + (k === activeTab ? "active" : "")
btn.innerHTML = `
<span>${k}</span>
<span class="tab-badge">${p.kategori[k].length}</span>
`

btn.onclick = () => {
activeTab = k

document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"))
btn.classList.add("active")

renderActiveTab()
}

tabNav.appendChild(btn)
})

renderActiveTab()

updateSummary()

},400)
}

/* ================= SUMMARY ================= */
function updateSummary(){
if(!currentProject) return
let p=projects[currentProject]

p.diskon=Number(diskon.value)||0
p.margin=Number(margin.value)||0
p.ppn=Number(ppn.value)||0

let subtotal=0
Object.values(p.kategori).forEach(arr=>{
arr.forEach(it=>subtotal+=it.volume*it.harga)
})

let disk=subtotal*(p.diskon/100)
let afterDisk=subtotal-disk
let ppnVal=afterDisk*(p.ppn/100)
let grand=afterDisk+ppnVal
let profit=grand*(p.margin/100)

summary.innerHTML=`
<div class="summary-box">
<small>Subtotal</small>
<strong>Rp ${formatRp(subtotal)}</strong>
</div>

<div class="summary-box">
<small>Diskon</small>
<strong>Rp ${formatRp(disk)}</strong>
</div>

<div class="summary-box">
<small>PPN</small>
<strong>Rp ${formatRp(ppnVal)}</strong>
</div>

<div class="summary-box total">
<small>Grand Total</small>
<strong>Rp ${formatRp(grand)}</strong>
</div>

<div class="summary-box">
<small>Estimasi Profit</small>
<strong style="color:#22c55e">
Rp ${formatRp(profit)}
</strong>
</div>
`

renderChart(subtotal,profit)
save()
}

/* ================= CHART ================= */
function renderChart(total,profit){
if(chartInstance) chartInstance.destroy()
chartInstance=new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels:["Biaya","Profit"],
datasets:[{data:[total,profit]}]
},
options:{responsive:true}
})
}

/* ================= EXPORT ================= */
function exportExcel(){
let wb=XLSX.utils.book_new()
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]]
let p=projects[currentProject]

Object.keys(p.kategori).forEach(k=>{
p.kategori[k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga])
})
})

let ws=XLSX.utils.aoa_to_sheet(rows)
XLSX.utils.book_append_sheet(wb,ws,"RAB")
XLSX.writeFile(wb,currentProject+"_RAB.xlsx")
}

/* ================= INIT ================= */
renderProjects()
if(!currentProject && Object.keys(projects).length>0){
currentProject=Object.keys(projects)[0]
}
render()

</script>
</body>
</html>
