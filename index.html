<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Platinum 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
-webkit-font-smoothing:antialiased;
}

body{
background:#0b0c10;
color:#f5f5f7;
padding:50px 20px;
min-height:100vh;
}

/* ================= CONTAINER ================= */
.container{
max-width:1050px;
margin:auto;
}

/* ================= TITLE ================= */
h1{
text-align:center;
font-size:36px;
font-weight:700;
letter-spacing:-0.6px;
margin-bottom:60px;
color:#ffffff;
}

/* ================= CARD ================= */
.card{
background:linear-gradient(145deg,#14151a,#101114);
border-radius:30px;
padding:35px;
margin-bottom:35px;
border:1px solid rgba(255,255,255,0.06);
box-shadow:
0 10px 40px rgba(0,0,0,0.6),
inset 0 1px 0 rgba(255,255,255,0.04);
transition:all .3s ease;
position:relative;
}

.card:hover{
box-shadow:
0 20px 60px rgba(0,0,0,0.7),
inset 0 1px 0 rgba(255,255,255,0.06);
}

/* ================= FORM SPACING ================= */
label{
display:block;
margin-top:22px;
margin-bottom:8px;
font-size:13px;
opacity:0.6;
letter-spacing:.4px;
}

/* ================= INPUT ================= */
input,select{
width:100%;
padding:15px 18px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.08);
background:#181a20;
color:#fff;
font-size:14px;
outline:none;
transition:all .25s ease;
}

input:focus,select:focus{
border-color:#d4af37;
background:#1e2128;
}

/* ================= BUTTON ================= */
button{
padding:14px 22px;
border-radius:18px;
border:none;
font-weight:600;
font-size:14px;
cursor:pointer;
margin-top:18px;
transition:all .25s ease;
letter-spacing:.4px;
}

button:hover{
transform:translateY(-2px);
opacity:.92;
}

/* BUTTON VARIANTS */
.btn-primary{
background:linear-gradient(135deg,#1e3a8a,#2563eb);
color:#fff;
}

.btn-success{
background:linear-gradient(135deg,#14532d,#16a34a);
color:#fff;
}

.btn-danger{
background:#2a2a2e;
color:#ff4d4f;
}

.btn-warning{
background:linear-gradient(135deg,#b45309,#f59e0b);
color:#000;
}

.btn-dark{
background:#1f2937;
color:#fff;
}

.btn-gold{
background:linear-gradient(135deg,#d4af37,#facc15);
color:#000;
}

.btn-delete-project{
background:linear-gradient(135deg,#6d28d9,#9333ea);
color:#fff;
}

/* ================= FLEX ================= */
.flex{
display:flex;
gap:18px;
flex-wrap:wrap;
margin-top:10px;
}

@media(max-width:768px){
.flex{flex-direction:column;}
}

/* ================= TABLE ================= */
table{
width:100%;
margin-top:25px;
border-collapse:separate;
border-spacing:0;
border-radius:24px;
overflow:hidden;
}

th{
background:#1c1e24;
padding:16px;
font-weight:600;
font-size:13px;
letter-spacing:.4px;
}

td{
background:#16181d;
padding:14px;
font-size:13px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

tr:last-child td{
border-bottom:none;
}

td,th{
text-align:center;
}

/* ================= EDIT INPUT ================= */
.edit-input{
background:#20232b;
border:1px solid rgba(255,255,255,0.08);
border-radius:14px;
padding:6px 10px;
color:#fff;
font-size:12px;
width:100px;
}

/* ================= DELETE KATEGORI ================= */
.btn-delete-kategori{
position:absolute;
top:28px;
right:28px;
background:#1f1f24;
color:#ff5c5c;
font-size:12px;
padding:8px 12px;
border-radius:14px;
}

/* ================= SUMMARY ================= */
.summary-card{
margin-top:30px;
padding:25px;
border-radius:26px;
background:linear-gradient(145deg,#191b21,#14161b);
border:1px solid rgba(255,255,255,0.06);
}

.total-box{
text-align:right;
margin-top:12px;
font-weight:500;
letter-spacing:.3px;
}

/* ================= TOGGLE ================= */
.toggle-modern{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 18px;
margin-top:18px;
border-radius:20px;
background:#1b1d23;
border:1px solid rgba(255,255,255,0.06);
}

input[type="checkbox"]{
width:20px;
height:20px;
accent-color:#d4af37;
cursor:pointer;
}

/* ================= LINK BOX ================= */
.link-box{
background:#121317;
padding:16px;
border-radius:20px;
font-size:12px;
margin-top:20px;
border:1px solid rgba(255,255,255,0.08);
word-break:break-all;
}

/* ================= SCROLL ================= */
::-webkit-scrollbar{
width:6px;
}
::-webkit-scrollbar-thumb{
background:rgba(255,255,255,0.15);
border-radius:10px;
}

</style>
</head>
<body>

<div class="container">

<h1>RAB Platinum 2026</h1>

<div class="card">

<label>Nama Project</label>
<input type="text" id="projectName" placeholder="Contoh: Trip Jepang 2026">
<button class="btn-delete-project" onclick="deleteProject()">Delete Project</button>

<label>Pilih Template</label>
<select id="templateSelect">
<option value="rumah">Properti - Rumah</option>
<option value="gedung">Konstruksi - Gedung</option>
<option value="kuliner">Usaha - Restoran</option>
<option value="startup">Startup Digital</option>
<option value="wedding">Event Wedding</option>

<option value="travel_liburan">Perjalanan - Liburan</option>
<option value="travel_dinas">Perjalanan - Dinas</option>
<option value="travel_umroh">Perjalanan - Umroh</option>
<option value="travel_corporate">Perjalanan - Corporate Trip</option>

<option value="custom">Custom (Kosong)</option>
</select>

<button class="btn-primary" onclick="applyTemplate()">Gunakan Template</button>

<hr style="margin:18px 0;border-color:rgba(255,255,255,0.08)">

<label>Tambah Kategori</label>
<input type="text" id="kategoriInput" placeholder="Contoh: Transportasi">
<button class="btn-success" onclick="addKategori()">Tambah</button>

<div id="kategoriContainer"></div>

<hr style="margin:18px 0;border-color:rgba(255,255,255,0.08)">

<div class="toggle">
<label>PPN 11%</label>
<input type="checkbox" id="ppnToggle" checked onchange="render()">
</div>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0" onchange="render()">

<label>Margin Profit (%)</label>
<input type="number" id="marginInput" value="20" onchange="render()">

<div id="summary"></div>

<div class="flex">
<button class="btn-warning" onclick="exportPDF()">Export PDF</button>
<button class="btn-gold" onclick="exportExcel()">Export Excel</button>
<button class="btn-dark" onclick="generateLink()">Generate Link</button>
</div>

<div id="generatedLink"></div>

</div>

<div class="card">
<h3>Grafik Analisa</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>

let data={}
let chartInstance=null
let diskonAktif=true
let profitAktif=true

function formatRp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function clean(n){return Number(String(n).replace(/\D/g,''))}

/* ================= DELETE PROJECT ================= */

function deleteProject(){
if(confirm("Yakin hapus seluruh project?")){
data={}
document.getElementById("projectName").value=""
render()
}
}

/* ================= TEMPLATE ================= */

function applyTemplate(){
let t=templateSelect.value

const templates = {
travel_liburan:{
"Transportasi":[{nama:"Tiket Pesawat PP",volume:1,harga:7500000}],
"Akomodasi":[{nama:"Hotel 5 Malam",volume:5,harga:1200000}],
"Konsumsi":[{nama:"Makan Harian",volume:5,harga:250000}],
"Tour & Tiket Wisata":[{nama:"Disneyland Ticket",volume:1,harga:1500000}]
},
travel_dinas:{
"Transportasi":[{nama:"Tiket Pesawat",volume:1,harga:3500000}],
"Hotel":[{nama:"Hotel 3 Malam",volume:3,harga:900000}],
"Uang Harian":[{nama:"Uang Harian",volume:3,harga:400000}]
},
travel_umroh:{
"Paket Umroh":[{nama:"Paket 9 Hari",volume:1,harga:35000000}],
"Perlengkapan":[{nama:"Perlengkapan Umroh",volume:1,harga:2000000}]
},
travel_corporate:{
"Transportasi":[{nama:"Bus Pariwisata",volume:1,harga:12000000}],
"Hotel":[{nama:"Hotel 2 Malam",volume:2,harga:15000000}],
"Team Building":[{nama:"Outbound Program",volume:1,harga:25000000}]
}
}

data = templates[t] || {}
render()
}

/* ================= KATEGORI ================= */

function addKategori(){
let k=kategoriInput.value.trim()
if(!k)return
if(!data[k])data[k]=[]
kategoriInput.value=""
render()
}

function deleteKategori(k){
if(confirm("Hapus kategori ini?")){
delete data[k]
render()
}
}

/* ================= ITEM ================= */

function addItem(k){
let nama=document.getElementById("nama_"+k).value
let volume=clean(document.getElementById("vol_"+k).value)
let harga=clean(document.getElementById("harga_"+k).value)
if(!nama||!volume||!harga)return
data[k].push({nama,volume,harga})
render()
}

function deleteItem(k,i){
data[k].splice(i,1)
render()
}

function editItem(k,i,field,value){
if(field==="nama") data[k][i].nama=value
if(field==="volume") data[k][i].volume=clean(value)
if(field==="harga") data[k][i].harga=clean(value)
render()
}

/* ================= RENDER ================= */

function render(){
let container=document.getElementById("kategoriContainer")
container.innerHTML=""
let totalAll=0

Object.keys(data).forEach(k=>{
let html=`<div class="card">
<button class="btn-delete-kategori" onclick="deleteKategori('${k}')">Delete</button>
<h3>${k}</h3>

<div class="flex">
<input id="nama_${k}" placeholder="Nama Item">
<input id="vol_${k}" placeholder="Volume">
<input id="harga_${k}" placeholder="Harga">
<button class="btn-primary" onclick="addItem('${k}')">Tambah</button>
</div>

<table>
<tr><th>Nama</th><th>Vol</th><th>Harga</th><th>Subtotal</th><th></th></tr>`

let total=0
data[k].forEach((it,i)=>{
let sub=it.volume*it.harga
total+=sub
html+=`
<tr>
<td><input class="edit-input" value="${it.nama}" onchange="editItem('${k}',${i},'nama',this.value)"></td>
<td><input class="edit-input" value="${it.volume}" onchange="editItem('${k}',${i},'volume',this.value)"></td>
<td><input class="edit-input" value="${it.harga}" onchange="editItem('${k}',${i},'harga',this.value)"></td>
<td>${formatRp(sub)}</td>
<td><button onclick="deleteItem('${k}',${i})" class="btn-danger">X</button></td>
</tr>`
})

totalAll+=total
html+=`</table>
<div class="total-box">Total ${k}: ${formatRp(total)}</div>
</div>`

container.innerHTML+=html
})

let diskon=diskonAktif?totalAll*(Number(diskonInput.value)/100):0
let subtotal=totalAll-diskon
let ppn=ppnToggle.checked?subtotal*0.11:0
let grand=subtotal+ppn
let profit=profitAktif?grand*(Number(marginInput.value)/100):0

summary.innerHTML=`
<div class="summary-card">

<div class="toggle-modern">
<span>Aktifkan Diskon</span>
<input type="checkbox" ${diskonAktif?"checked":""} onchange="diskonAktif=this.checked;render()">
</div>

<div class="toggle-modern">
<span>Aktifkan Profit</span>
<input type="checkbox" ${profitAktif?"checked":""} onchange="profitAktif=this.checked;render()">
</div>

<div class="total-box">Subtotal: ${formatRp(totalAll)}</div>
<div class="total-box">Diskon: ${formatRp(diskon)}</div>
<div class="total-box">PPN: ${formatRp(ppn)}</div>
<div class="total-box">Grand Total: ${formatRp(grand)}</div>
<div class="total-box" style="color:#facc15;font-size:18px">Estimasi Profit: ${formatRp(profit)}</div>

</div>`

renderChart(grand,profit)
}

/* ================= CHART ================= */

function renderChart(total,profit){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(chart,{
type:"bar",
data:{labels:["Grand Total","Profit"],
datasets:[{data:[total,profit]}]},
options:{plugins:{legend:{display:false}}}
})
}

/* ================= EXPORT ================= */

function exportPDF(){html2pdf().from(document.body).save("RAB.pdf")}
function exportExcel(){
let wb=XLSX.utils.book_new()
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]]
Object.keys(data).forEach(k=>{
data[k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga])
})
})
let ws=XLSX.utils.aoa_to_sheet(rows)
XLSX.utils.book_append_sheet(wb,ws,"RAB")
XLSX.writeFile(wb,"RAB.xlsx")
}

function generateLink(){
let encoded=btoa(JSON.stringify(data))
let url=location.origin+location.pathname+"?data="+encoded
generatedLink.innerHTML=`<div class="link-box">${url}</div>`
}

window.onload=function(){
let params=new URLSearchParams(window.location.search)
if(params.get("data")){
data=JSON.parse(atob(params.get("data")))
}
render()
}

</script>
</body>
</html>
