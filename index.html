<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RAB iOS 17 Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:linear-gradient(180deg,#0f0f11,#000);
color:#fff;
padding:20px 16px 120px;
min-height:100vh;
}

h1{
font-size:28px;
font-weight:700;
margin-bottom:20px;
letter-spacing:-0.5px;
}

.section{
margin-bottom:22px;
}

.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
border-radius:22px;
padding:18px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

label{
font-size:12px;
opacity:.6;
margin-bottom:6px;
display:block;
}

input{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:rgba(255,255,255,0.08);
color:#fff;
font-size:15px;
margin-bottom:12px;
}

input:focus{
outline:none;
background:rgba(255,255,255,0.15);
}

button{
width:100%;
padding:14px;
border-radius:16px;
border:none;
font-weight:600;
font-size:15px;
margin-top:8px;
transition:.2s;
}

button:active{transform:scale(.97)}

.btn-primary{background:#0a84ff;color:#fff}
.btn-success{background:#30d158;color:#000}
.btn-danger{background:#ff453a;color:#fff}

.category-card{
margin-top:16px;
padding:16px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
}

.category-title{
display:flex;
justify-content:space-between;
align-items:center;
font-weight:600;
margin-bottom:10px;
}

.item{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:16px;
margin-bottom:10px;
}

.item input{
background:transparent;
padding:6px 0;
margin-bottom:6px;
font-size:14px;
}

.subtotal{
font-size:13px;
opacity:.7;
margin-top:6px;
}

.bottom-summary{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(20,20,22,0.9);
backdrop-filter:blur(25px);
border-top:1px solid rgba(255,255,255,0.1);
padding:16px;
border-top-left-radius:28px;
border-top-right-radius:28px;
}

.summary-total{
font-size:20px;
font-weight:700;
}

.summary-small{
font-size:13px;
opacity:.6;
margin-top:4px;
}

canvas{
margin-top:10px;
}
</style>
</head>
<body>

<h1>RAB</h1>

<div class="section glass">
<label>Nama Project</label>
<input id="projectName">

<label>Tambah Kategori</label>
<input id="kategoriInput" placeholder="Contoh: Struktur">
<button class="btn-primary" onclick="addKategori()">Tambah Kategori</button>
</div>

<div id="kategoriContainer"></div>

<div class="bottom-summary">
<div id="summaryContent"></div>
<canvas id="chart" height="80"></canvas>
</div>

<script>
let data={}
let chartInstance=null

function formatRp(n){
return "Rp "+Number(n||0).toLocaleString("id-ID")
}

function addKategori(){
let k=document.getElementById("kategoriInput").value.trim()
if(!k)return
if(!data[k])data[k]=[]
document.getElementById("kategoriInput").value=""
render()
}

function addItem(k){
data[k].push({nama:"Item Baru",volume:1,harga:0})
render()
}

function deleteItem(k,i){
data[k].splice(i,1)
render()
}

function updateItem(k,i,field,value){
if(field=="volume"||field=="harga"){
data[k][i][field]=Number(value)||0
}else{
data[k][i][field]=value
}
render(false)
}

function render(updateChart=true){

let container=document.getElementById("kategoriContainer")
container.innerHTML=""
let subtotal=0

Object.keys(data).forEach(k=>{
let totalKategori=0

let html=`
<div class="category-card">
<div class="category-title">
<span>${k}</span>
<button class="btn-success" style="width:auto;padding:6px 12px;font-size:13px" onclick="addItem('${k}')">+ Item</button>
</div>
`

data[k].forEach((it,i)=>{
let sub=it.volume*it.harga
totalKategori+=sub
html+=`
<div class="item">
<input value="${it.nama}" onchange="updateItem('${k}',${i},'nama',this.value)">
<input type="number" value="${it.volume}" onchange="updateItem('${k}',${i},'volume',this.value)">
<input type="number" value="${it.harga}" onchange="updateItem('${k}',${i},'harga',this.value)">
<div class="subtotal">${formatRp(sub)}</div>
<button class="btn-danger" onclick="deleteItem('${k}',${i})">Hapus</button>
</div>
`
})

subtotal+=totalKategori

html+=`<div class="subtotal">Total ${formatRp(totalKategori)}</div></div>`
container.innerHTML+=html
})

document.getElementById("summaryContent").innerHTML=`
<div class="summary-total">${formatRp(subtotal)}</div>
<div class="summary-small">Total Keseluruhan</div>
`

if(updateChart)renderChart(subtotal)
}

function renderChart(total){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels:["Total"],
datasets:[{
data:[total,1],
backgroundColor:["#0a84ff","rgba(255,255,255,0.05)"],
borderWidth:0
}]
},
options:{
cutout:"80%",
plugins:{legend:{display:false}},
responsive:true
}
})
}

render()
</script>

</body>
</html>
