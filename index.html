<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB PRO 2026 - DTSCRIPTID</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=2.1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js" defer></script>
<script src="script.js"></script>
</head>
<body>

<header>
  <div class="liquid-v2"></div>
  <div class="header-content">
    <h1>RAB PRO 2026</h1>
<div class="enterprise-badge">
Enterprise Edition • v2.0.0 • DTSCRIPTID
</div>
  </div>
</header>

<div class="wrapper">

<!-- SIDEBAR -->
<div class="sidebar">
<h3 style="margin-bottom:10px">Projects</h3>
<input 
  type="text" 
  id="projectSearch" 
  placeholder="Cari project..." 
  oninput="renderProjects()"
  style="margin-bottom:12px"
>
<div class="sort-wrapper">

  <div class="sort-label">Sort by created date</div>

  <div class="sort-button" onclick="toggleSortMenu()">
    ⬍
  </div>

  <div class="sort-dropdown" id="sortDropdown">
    <div onclick="setSort('newest')" id="sortNewest">Terbaru</div>
    <div onclick="setSort('oldest')" id="sortOldest">Terlama</div>
  </div>

</div>

</div>
<div id="projectList"></div>

<div id="projectToggle" 
     style="margin-top:10px;font-size:12px;opacity:.6;cursor:pointer;display:none"
     onclick="toggleProjectCollapse()">
Lihat Semua
</div>
<div class="template-box">
<div class="template-label">Template RAB</div>

<div id="templateGrid" class="template-grid collapsed">
<div class="template-card">Liburan</div>
<div class="template-card">Renovasi</div>
<div class="template-card">Coffee</div>

<div class="template-card extra">Event</div>
<div class="template-card extra">Wedding</div>
<div class="template-card extra">Kontrakan</div>
<div class="template-card extra">Laundry</div>
<div class="template-card extra">Fashion</div>
<div class="template-card extra">Umroh</div>
<div class="template-card extra">Rumah 36</div>
<div class="template-card extra">Startup</div>

</div>

<div class="template-toggle" onclick="toggleTemplate()">
Lihat Lebih Banyak
</div>
</div>
<div class="ai-box">
<div class="ai-header">🤖 AI RAB Generator</div>

<div class="ai-input-wrap">
<input id="aiPrompt" placeholder="Contoh: Buatkan RAB bengkel motor 80jt">
<button onclick="generateFromText()">Generate</button>
</div>

<div id="aiStatus" class="ai-status"></div>
<div id="aiInsight" class="ai-insight"></div>
</div>
<input id="newProject" placeholder="Nama Project">
<button class="btn-primary" style="margin-top:10px;width:100%" onclick="createProject()">Tambah</button>
<button class="btn-danger" style="margin-top:8px;width:100%" onclick="deleteProject()">Hapus</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="card">
<label>Nama Project</label>
<input id="projectName" onblur="renameProject()">

<div style="margin-top:15px">
<label>Tambah Kategori</label>
<input id="newKategori">
<button class="btn-success" style="margin-top:8px" onclick="addKategori()">Tambah Kategori</button>
</div>

<div id="kategoriContainer"></div>

<h3 style="margin-top:20px">Pengaturan</h3>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin-top:10px">
<div>
<label>Diskon %</label>
<input type="number" id="diskon" oninput="updateSummary()">
</div>
<div>
<label>Margin %</label>
<input type="number" id="margin" oninput="updateSummary()">
</div>
<div>
<label>PPN %</label>
<input type="number" id="ppn" oninput="updateSummary()">
</div>
</div>

<div class="summary" id="summary"></div>

<button class="btn-warning" onclick="exportExcel()">Export Excel</button>

</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<div class="watermark">
  DTSCRIPTID • RAB PRO 2026
</div>

</div>
</div>

</body>
</html>
