<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Platinum 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
background:radial-gradient(circle at top left,#1e293b,#0f172a 60%);
color:#fff;
padding:25px;
}
.container{max-width:1200px;margin:auto}
h1{
text-align:center;
margin-bottom:35px;
font-size:32px;
font-weight:800;
background:linear-gradient(90deg,#3b82f6,#facc15);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(30px);
border-radius:28px;
padding:25px;
margin-bottom:25px;
box-shadow:0 30px 80px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.07);
transition:0.3s;
}
.card:hover{
transform:translateY(-4px);
box-shadow:0 40px 90px rgba(0,0,0,0.8);
}
label{font-size:13px;opacity:0.7;margin-top:10px;display:block}
input,select{
width:100%;
padding:12px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.08);
margin-top:6px;
background:rgba(255,255,255,0.1);
color:#fff;
font-size:14px;
outline:none;
}
input:focus,select:focus{border-color:#3b82f6}
button{
padding:10px 16px;
border-radius:16px;
border:none;
font-weight:600;
cursor:pointer;
margin-top:8px;
transition:0.2s;
}
button:hover{transform:translateY(-2px)}
.btn-primary{background:#3b82f6}
.btn-success{background:#22c55e}
.btn-danger{background:#ef4444}
.btn-warning{background:#f59e0b}
.btn-dark{background:#1f2937}
.btn-gold{background:linear-gradient(45deg,#d4af37,#facc15);color:#000}
.flex{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:700px){.flex{flex-direction:column}}
table{
width:100%;
border-collapse:collapse;
margin-top:15px;
font-size:13px;
}
th,td{
padding:10px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}
th{background:rgba(255,255,255,0.05)}
.total-box{text-align:right;margin-top:10px;font-weight:600}
.summary-card{
background:linear-gradient(145deg,rgba(59,130,246,0.2),rgba(250,204,21,0.15));
border-radius:20px;
padding:18px;
margin-top:18px;
}
.edit-input{
background:transparent;
border:none;
color:#fff;
width:100%;
text-align:center;
}
</style>
</head>
<body>

<div class="container">
<h1>RAB Platinum 2026</h1>

<div class="card">

<label>Nama Project</label>
<input type="text" id="projectName">

<div class="flex">
<button class="btn-danger" onclick="deleteProject()">Delete Project</button>
</div>

<hr style="margin:20px 0;border-color:rgba(255,255,255,0.1)">

<label>Pilih Template</label>
<select id="templateSelect">
<option value="">-- Pilih Template --</option>
<option value="rumah">Properti - Rumah</option>
<option value="resto">Usaha - Restoran</option>
<option value="travel">Perjalanan - Liburan</option>
<option value="startup">Startup Digital</option>
<option value="wedding">Event Wedding</option>
<option value="custom">Custom Kosong</option>
</select>
<button class="btn-primary" onclick="applyTemplate()">Gunakan Template</button>

<hr style="margin:20px 0;border-color:rgba(255,255,255,0.1)">

<label>Tambah Kategori</label>
<input type="text" id="kategoriInput">
<button class="btn-success" onclick="addKategori()">Tambah</button>

<div id="kategoriContainer"></div>

<hr style="margin:20px 0;border-color:rgba(255,255,255,0.1)">

<div class="flex">
<label>PPN 11%</label>
<input type="checkbox" id="ppnToggle" checked onchange="render()">

<label>Aktif Diskon</label>
<input type="checkbox" id="diskonToggle" checked onchange="render()">

<label>Aktif Profit</label>
<input type="checkbox" id="profitToggle" checked onchange="render()">
</div>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0" onchange="render()">

<label>Margin Profit (%)</label>
<input type="number" id="marginInput" value="20" onchange="render()">

<div id="summary"></div>

</div>

<div class="card">
<h3>Grafik Analisa</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>
let data={}
let chartInstance=null

function formatRp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function clean(n){return Number(String(n).replace(/\D/g,''))}

/* ================= TEMPLATE ================= */

function applyTemplate(){
let t=document.getElementById("templateSelect").value

const templates={

rumah:{
"Persiapan":[{nama:"Pembersihan Lahan",volume:1,harga:5000000}],
"Struktur":[{nama:"Pondasi",volume:1,harga:30000000}],
"Finishing":[{nama:"Cat & Interior",volume:1,harga:15000000}]
},

resto:{
"Renovasi":[{nama:"Interior",volume:1,harga:25000000}],
"Peralatan":[{nama:"Kitchen Set",volume:1,harga:40000000}],
"Operasional":[{nama:"Bahan Baku Awal",volume:1,harga:10000000}]
},

travel:{
"Transportasi":[{nama:"Tiket Pesawat PP",volume:1,harga:7000000}],
"Hotel":[{nama:"Hotel 5 Malam",volume:5,harga:1200000}],
"Wisata":[{nama:"Tiket Atraksi",volume:1,harga:2000000}]
},

startup:{
"Development":[{nama:"Pembuatan Aplikasi",volume:1,harga:80000000}],
"Marketing":[{nama:"Iklan Digital",volume:1,harga:20000000}]
},

wedding:{
"Venue":[{nama:"Sewa Gedung",volume:1,harga:50000000}],
"Catering":[{nama:"Catering 500 Pax",volume:500,harga:80000}]
}

}

data = t==="custom" ? {} : (templates[t] || {})
render()
}

/* ================= CORE ================= */

function deleteProject(){
if(confirm("Hapus seluruh project?")){
data={}
render()
}
}

function addKategori(){
let k=kategoriInput.value.trim()
if(!k)return
if(!data[k])data[k]=[]
kategoriInput.value=""
render()
}

function deleteKategori(k){
delete data[k]
render()
}

function addItem(k){
let nama=document.getElementById("nama_"+k).value
let volume=clean(document.getElementById("vol_"+k).value)
let harga=clean(document.getElementById("harga_"+k).value)
if(!nama||!volume||!harga)return
data[k].push({nama,volume,harga})
render()
}

function updateItem(k,i,field,value){
if(field==="nama")data[k][i].nama=value
if(field==="volume")data[k][i].volume=clean(value)
if(field==="harga")data[k][i].harga=clean(value)
render()
}

function deleteItem(k,i){
data[k].splice(i,1)
render()
}

function render(){
let container=document.getElementById("kategoriContainer")
container.innerHTML=""
let totalAll=0

Object.keys(data).forEach(k=>{
let html=`<div class="card">
<div class="flex" style="justify-content:space-between">
<h3>${k}</h3>
<button class="btn-danger" onclick="deleteKategori('${k}')">Delete</button>
</div>

<div class="flex">
<input id="nama_${k}" placeholder="Nama Item">
<input id="vol_${k}" placeholder="Volume">
<input id="harga_${k}" placeholder="Harga">
<button class="btn-primary" onclick="addItem('${k}')">Tambah</button>
</div>

<table>
<tr>
<th>Nama</th><th>Vol</th><th>Harga</th><th>Subtotal</th><th></th>
</tr>`

let total=0
data[k].forEach((it,i)=>{
let sub=it.volume*it.harga
total+=sub
html+=`
<tr>
<td><input class="edit-input" value="${it.nama}" onchange="updateItem('${k}',${i},'nama',this.value)"></td>
<td><input class="edit-input" value="${it.volume}" onchange="updateItem('${k}',${i},'volume',this.value)"></td>
<td><input class="edit-input" value="${it.harga}" onchange="updateItem('${k}',${i},'harga',this.value)"></td>
<td>${formatRp(sub)}</td>
<td><button onclick="deleteItem('${k}',${i})" class="btn-danger">X</button></td>
</tr>`
})

totalAll+=total

html+=`</table>
<div class="total-box">Total ${k}: ${formatRp(total)}</div>
</div>`

container.innerHTML+=html
})

let diskon=diskonToggle.checked?totalAll*(diskonInput.value/100):0
let subtotal=totalAll-diskon
let ppn=ppnToggle.checked?subtotal*0.11:0
let grand=subtotal+ppn
let profit=profitToggle.checked?grand*(marginInput.value/100):0

summary.innerHTML=`
<div class="summary-card">
<div class="total-box">Subtotal: ${formatRp(totalAll)}</div>
<div class="total-box">Diskon: ${formatRp(diskon)}</div>
<div class="total-box">PPN: ${formatRp(ppn)}</div>
<div class="total-box">Grand Total: ${formatRp(grand)}</div>
<div class="total-box" style="color:#facc15;font-size:18px">Profit: ${formatRp(profit)}</div>
</div>`

renderChart(grand,profit)
}

function renderChart(total,profit){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(chart,{
type:"bar",
data:{labels:["Grand Total","Profit"],
datasets:[{data:[total,profit]}]},
options:{plugins:{legend:{display:false}}}
})
}

render()
</script>
</body>
</html>
