<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Enterprise Platinum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:linear-gradient(180deg,#0f172a,#111827);color:#fff;padding:20px}
.container{max-width:1200px;margin:auto}
h1{text-align:center;margin-bottom:25px;font-weight:700}
.card{background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:20px;padding:20px;margin-bottom:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.4)}
input,select{
width:100%;padding:12px;border-radius:14px;border:none;
margin:6px 0;background:rgba(255,255,255,0.15);color:#fff;font-size:14px}
button{
padding:10px 14px;border-radius:14px;border:none;
font-weight:600;cursor:pointer;margin:4px;transition:0.2s}
button:hover{transform:scale(1.05)}
.btn-primary{background:#3b82f6}
.btn-success{background:#22c55e}
.btn-danger{background:#ef4444}
.btn-warning{background:#f59e0b}
.btn-dark{background:#111827}
.btn-gold{background:linear-gradient(45deg,#d4af37,#facc15);color:#000}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:8px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.15)}
th{background:rgba(255,255,255,0.08)}
.total-box{text-align:right;margin-top:8px;font-weight:600}
.flex{display:flex;gap:10px;flex-wrap:wrap}
canvas{background:#fff;border-radius:15px;margin-top:15px}
@media(max-width:700px){.flex{flex-direction:column}}
</style>
</head>
<body>

<div class="container">
<h1>RAB Enterprise Platinum</h1>

<div class="card" id="adminPanel">

<label>Project</label>
<select id="projectSelect" onchange="render()"></select>

<div class="flex">
<input type="text" id="newProject" placeholder="Project baru">
<button class="btn-success" onclick="addProject()">Tambah</button>
<button class="btn-danger" onclick="deleteProject()">Hapus</button>
</div>

<label>Gunakan Template</label>
<div class="flex">
<select id="templateSelect"></select>
<button class="btn-primary" onclick="applyTemplate()">Gunakan</button>
</div>

<label>Kategori</label>
<select id="kategoriSelect"></select>

<div class="flex">
<input type="text" id="newKategori" placeholder="Kategori baru">
<button class="btn-success" onclick="addKategori()">Tambah</button>
<button class="btn-danger" onclick="deleteKategori()">Hapus</button>
</div>

<input type="text" id="nama" placeholder="Nama Item">
<input type="text" id="volume" placeholder="Volume">
<input type="text" id="harga" placeholder="Harga (Rp)">
<button class="btn-primary" onclick="addItem()">Tambah Item</button>

<hr style="margin:15px 0;border-color:rgba(255,255,255,0.1)">

<label>PPN (%)</label>
<input type="number" id="ppnInput" value="11" onchange="render()">

<label>Diskon Global (%)</label>
<input type="number" id="diskonInput" value="0" onchange="render()">

<label>Margin Profit (%)</label>
<input type="number" id="marginInput" value="20" onchange="render()">

<div class="flex">
<button class="btn-warning" onclick="exportPDF()">Export PDF</button>
<button class="btn-gold" onclick="exportExcel()">Export Excel</button>
<button class="btn-dark" onclick="generateLink()">Generate Link Klien</button>
<button class="btn-dark" onclick="backupData()">Backup JSON</button>
<input type="file" onchange="restoreData(event)" style="max-width:200px">
</div>

</div>

<div id="output"></div>

<div class="card">
<h3>Grafik Profit</h3>
<canvas id="profitChart"></canvas>
</div>

<div class="card">
<h3>Tanda Tangan Digital</h3>
<input type="text" id="ttdNama" placeholder="Disetujui oleh">
<canvas id="signature" width="400" height="200"></canvas><br>
<button class="btn-danger" onclick="clearSignature()">Clear</button>
</div>

</div>

<script>

/* ================= 100+ TEMPLATE ================= */

const templateNames = Array.from({length:120},(_,i)=>"Template Bisnis "+(i+1));

templateSelect.innerHTML='<option value="">-- Pilih Template --</option>';
templateNames.forEach(t=>{
templateSelect.innerHTML+=`<option value="${t}">${t}</option>`;
});

function generateTemplate(name){
return {
"Perencanaan":[
{nama:`Survey ${name}`,volume:1,harga:1000000},
{nama:`Administrasi ${name}`,volume:1,harga:800000}
],
"Material":[
{nama:`Material Utama`,volume:10,harga:500000},
{nama:`Material Pendukung`,volume:5,harga:300000}
],
"Tenaga Kerja":[
{nama:`Pekerja`,volume:20,harga:200000},
{nama:`Supervisor`,volume:10,harga:300000}
],
"Operasional":[
{nama:`Transport`,volume:5,harga:150000},
{nama:`Konsumsi`,volume:20,harga:50000}
]
};
}

/* ================= CORE SYSTEM ================= */

let data=JSON.parse(localStorage.getItem("rabEnterprise"))||{};
let chartInstance=null;

function save(){localStorage.setItem("rabEnterprise",JSON.stringify(data))}
function formatRp(n){return "Rp "+Number(n).toLocaleString("id-ID")}
function cleanNumber(v){return Number(String(v).replace(/\D/g,''))}

function loadProjects(){
projectSelect.innerHTML="";
Object.keys(data).forEach(p=>projectSelect.innerHTML+=`<option>${p}</option>`);
if(Object.keys(data).length===0){
data["Project 1"]={}; save(); loadProjects();
}
}

function addProject(){
let n=newProject.value.trim();
if(!n)return;
data[n]={}; save(); loadProjects(); render();
}

function deleteProject(){
let p=projectSelect.value;
if(confirm("Hapus project ini?")){
delete data[p]; save(); loadProjects(); render();
}
}

function applyTemplate(){
let p=projectSelect.value;
let t=templateSelect.value;
if(!t)return alert("Pilih template dulu");
data[p]=generateTemplate(t);
save(); render();
}

function loadKategori(){
let p=projectSelect.value;
kategoriSelect.innerHTML="";
Object.keys(data[p]||{}).forEach(k=>kategoriSelect.innerHTML+=`<option>${k}</option>`);
}

function addKategori(){
let p=projectSelect.value;
let k=newKategori.value.trim();
if(!k)return;
if(!data[p])data[p]={};
data[p][k]=[]; save(); render();
}

function deleteKategori(){
let p=projectSelect.value;
let k=kategoriSelect.value;
delete data[p][k]; save(); render();
}

function addItem(){
let p=projectSelect.value;
let k=kategoriSelect.value;
if(!k)return;
let item={nama:nama.value,volume:cleanNumber(volume.value),harga:cleanNumber(harga.value)};
if(!item.nama||!item.volume||!item.harga)return;
data[p][k].push(item);
save(); render();
nama.value=""; volume.value=""; harga.value="";
}

function updateItem(p,k,i,field,value){
if(field==="harga") value=cleanNumber(value);
if(field==="volume") value=Number(value);
data[p][k][i][field]=value;
save(); render();
}

function deleteItem(p,k,i){
data[p][k].splice(i,1);
save(); render();
}

function render(){
loadKategori();
let p=projectSelect.value;
let out=output; out.innerHTML="";
let totalAll=0;

Object.keys(data[p]||{}).forEach(k=>{
let total=0;
let html=`<div class="card"><h3>${k}</h3><table>
<tr><th>No</th><th>Nama</th><th>Vol</th><th>Harga</th><th>Subtotal</th><th>Action</th></tr>`;

data[p][k].forEach((it,i)=>{
let sub=it.volume*it.harga; total+=sub;
html+=`<tr>
<td>${i+1}</td>
<td contenteditable="true" onblur="updateItem('${p}','${k}',${i},'nama',this.innerText)">${it.nama}</td>
<td contenteditable="true" onblur="updateItem('${p}','${k}',${i},'volume',this.innerText)">${it.volume}</td>
<td contenteditable="true" onblur="updateItem('${p}','${k}',${i},'harga',this.innerText)">${formatRp(it.harga)}</td>
<td>${formatRp(sub)}</td>
<td><button onclick="deleteItem('${p}','${k}',${i})" class="btn-danger">X</button></td>
</tr>`;
});

totalAll+=total;
html+=`</table><div class="total-box">Total: ${formatRp(total)}</div></div>`;
out.innerHTML+=html;
});

let ppn=totalAll*(Number(ppnInput.value)/100);
let diskon=totalAll*(Number(diskonInput.value)/100);
let subtotal=totalAll-diskon;
let grand=subtotal+ppn;
let margin=grand*(Number(marginInput.value)/100);

out.innerHTML+=`
<div class="card">
<div class="total-box">Subtotal: ${formatRp(totalAll)}</div>
<div class="total-box">Diskon: ${formatRp(diskon)}</div>
<div class="total-box">PPN: ${formatRp(ppn)}</div>
<div class="total-box">Grand Total: ${formatRp(grand)}</div>
<div class="total-box" style="font-size:18px;color:#facc15">Estimasi Profit: ${formatRp(margin)}</div>
</div>`;

renderChart(grand,margin);
}

function renderChart(total,profit){
if(chartInstance) chartInstance.destroy();
chartInstance=new Chart(profitChart,{
type:'bar',
data:{labels:['Grand Total','Profit'],
datasets:[{data:[total,profit]}]},
options:{plugins:{legend:{display:false}}}
});
}

/* EXPORT EXCEL */
function exportExcel(){
let wb=XLSX.utils.book_new();
let p=projectSelect.value;
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]];
Object.keys(data[p]).forEach(k=>{
data[p][k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga]);
});
});
let ws=XLSX.utils.aoa_to_sheet(rows);
XLSX.utils.book_append_sheet(wb,ws,"RAB");
XLSX.writeFile(wb,"RAB-"+p+".xlsx");
}

/* BACKUP & RESTORE */
function backupData(){
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup-rab.json";
a.click();
}
function restoreData(e){
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(evt){
data=JSON.parse(evt.target.result);
save(); render();
};
reader.readAsText(file);
}

/* SIGNATURE */
let canvas=signature;
let ctx=canvas.getContext("2d");
ctx.lineWidth=2; ctx.lineCap="round";
let drawing=false;
canvas.onmousedown=()=>drawing=true;
canvas.onmouseup=()=>{drawing=false;ctx.beginPath();}
canvas.onmousemove=e=>{
if(!drawing)return;
let rect=canvas.getBoundingClientRect();
ctx.lineTo(e.clientX-rect.left,e.clientY-rect.top);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(e.clientX-rect.left,e.clientY-rect.top);
};
function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height)}

loadProjects();
render();

</script>
</body>
</html>
