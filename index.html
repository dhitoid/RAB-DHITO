<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Platinum 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
-webkit-font-smoothing:antialiased;
}

body{
background:#000;
color:#f5f5f7;
padding:30px 14px;
min-height:100vh;
}

/* ================= CONTAINER ================= */
.container{
max-width:480px;
margin:auto;
}

/* ================= TITLE ================= */
h1{
text-align:center;
font-size:28px;
font-weight:700;
margin-bottom:30px;
letter-spacing:-0.4px;
}

/* ================= CARD ================= */
.card{
background:#1c1c1e;
border-radius:22px;
padding:22px 18px;
margin-bottom:22px;
border:1px solid rgba(255,255,255,0.05);
}

/* ================= SECTION DIVIDER ================= */
hr{
border:none;
height:1px;
background:rgba(255,255,255,0.08);
margin:20px 0;
}

/* ================= LABEL ================= */
label{
display:block;
font-size:13px;
opacity:.6;
margin-bottom:6px;
margin-top:18px;
}

/* ================= INPUT ================= */
input,select{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:#2c2c2e;
color:#fff;
font-size:14px;
outline:none;
}

input:focus,select:focus{
background:#3a3a3c;
}

/* ================= BUTTON ================= */
button{
width:100%;
padding:14px;
border-radius:14px;
border:none;
font-weight:600;
font-size:14px;
margin-top:12px;
cursor:pointer;
transition:.2s;
}

button:active{
transform:scale(.97);
}

/* BUTTON COLORS */
.btn-primary{background:#0a84ff;color:#fff;}
.btn-success{background:#30d158;color:#000;}
.btn-warning{background:#ff9f0a;color:#000;}
.btn-dark{background:#3a3a3c;color:#fff;}
.btn-gold{background:#ffd60a;color:#000;}
.btn-delete-project{background:#ff453a;color:#fff;margin-top:10px;}
.btn-danger{background:#2c2c2e;color:#ff453a;}

/* ================= FLEX BUTTON GROUP ================= */
.flex{
display:flex;
flex-direction:column;
gap:10px;
margin-top:14px;
}

/* ================= KATEGORI CARD ================= */
.kategori-card{
background:#2c2c2e;
border-radius:18px;
padding:16px;
margin-top:16px;
position:relative;
}

.btn-delete-kategori{
position:absolute;
right:12px;
top:12px;
background:#3a3a3c;
color:#ff453a;
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

/* ================= IOS LIST STYLE (GANTI TABLE FEEL) ================= */
table{
width:100%;
border-collapse:separate;
border-spacing:0 8px;
margin-top:12px;
}

th{
display:none; /* sembunyikan header biar iOS feel */
}

td{
display:block;
background:#1c1c1e;
padding:12px;
border-radius:14px;
margin-bottom:6px;
text-align:left;
font-size:13px;
}

td:before{
content:attr(data-label);
display:block;
font-size:11px;
opacity:.5;
margin-bottom:4px;
}

/* ================= EDIT INPUT ================= */
.edit-input{
width:100%;
background:#2c2c2e;
border:none;
border-radius:10px;
padding:8px;
color:#fff;
font-size:13px;
}

/* ================= TOGGLE IOS ================= */
.toggle{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:18px;
background:#2c2c2e;
padding:14px;
border-radius:14px;
}

input[type="checkbox"]{
width:40px;
height:22px;
appearance:none;
background:#3a3a3c;
border-radius:20px;
position:relative;
cursor:pointer;
transition:.3s;
}

input[type="checkbox"]:checked{
background:#0a84ff;
}

input[type="checkbox"]::before{
content:"";
position:absolute;
width:18px;
height:18px;
background:#fff;
border-radius:50%;
top:2px;
left:2px;
transition:.3s;
}

input[type="checkbox"]:checked::before{
left:20px;
}

/* ================= SUMMARY ================= */
#summary{
background:#2c2c2e;
padding:16px;
border-radius:18px;
margin-top:20px;
font-size:14px;
}

/* ================= LINK BOX ================= */
.link-box{
background:#2c2c2e;
padding:14px;
border-radius:14px;
font-size:12px;
margin-top:14px;
word-break:break-all;
}

/* ================= CHART CARD ================= */
canvas{
margin-top:10px;
}

</style>
</head>
<body>

<div class="container">

<h1>RAB Platinum 2026</h1>

<div class="card">

<label>Nama Project</label>
<input type="text" id="projectName" placeholder="Contoh: Trip Jepang 2026">
<button class="btn-delete-project" onclick="deleteProject()">Delete Project</button>

<label>Pilih Template</label>
<select id="templateSelect">
<option value="rumah">Properti - Rumah</option>
<option value="gedung">Konstruksi - Gedung</option>
<option value="kuliner">Usaha - Restoran</option>
<option value="startup">Startup Digital</option>
<option value="wedding">Event Wedding</option>

<option value="travel_liburan">Perjalanan - Liburan</option>
<option value="travel_dinas">Perjalanan - Dinas</option>
<option value="travel_umroh">Perjalanan - Umroh</option>
<option value="travel_corporate">Perjalanan - Corporate Trip</option>

<option value="custom">Custom (Kosong)</option>
</select>

<button class="btn-primary" onclick="applyTemplate()">Gunakan Template</button>

<hr style="margin:18px 0;border-color:rgba(255,255,255,0.08)">

<label>Tambah Kategori</label>
<input type="text" id="kategoriInput" placeholder="Contoh: Transportasi">
<button class="btn-success" onclick="addKategori()">Tambah</button>

<div id="kategoriContainer"></div>

<hr style="margin:18px 0;border-color:rgba(255,255,255,0.08)">

<div class="toggle">
<label>PPN 11%</label>
<input type="checkbox" id="ppnToggle" checked onchange="render()">
</div>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0" onchange="render()">

<label>Margin Profit (%)</label>
<input type="number" id="marginInput" value="20" onchange="render()">

<div id="summary"></div>

<div class="flex">
<button class="btn-warning" onclick="exportPDF()">Export PDF</button>
<button class="btn-gold" onclick="exportExcel()">Export Excel</button>
<button class="btn-dark" onclick="generateLink()">Generate Link</button>
</div>

<div id="generatedLink"></div>

</div>

<div class="card">
<h3>Grafik Analisa</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>

let data = {};
let chartInstance = null;
let diskonAktif = true;
let profitAktif = true;

/* ================= HELPERS ================= */

function formatRp(n){
  return "Rp " + Number(n || 0).toLocaleString("id-ID");
}

function clean(n){
  return Number(String(n).replace(/\D/g,'')) || 0;
}

function safeId(text){
  return text.replace(/\s+/g,'_').replace(/[^\w]/g,'');
}

/* ================= DELETE PROJECT ================= */

function deleteProject(){
  if(confirm("Yakin hapus seluruh project?")){
    data = {};
    document.getElementById("projectName").value = "";
    render();
  }
}

/* ================= TEMPLATE ================= */

function applyTemplate(){

  const templateSelect = document.getElementById("templateSelect");
  let t = templateSelect.value;

  const templates = {

    travel_liburan:{
      "Transportasi":[{nama:"Tiket Pesawat PP",volume:1,harga:7500000}],
      "Akomodasi":[{nama:"Hotel 5 Malam",volume:5,harga:1200000}],
      "Konsumsi":[{nama:"Makan Harian",volume:5,harga:250000}],
      "Tour & Tiket Wisata":[{nama:"Disneyland Ticket",volume:1,harga:1500000}]
    },

    travel_dinas:{
      "Transportasi":[{nama:"Tiket Pesawat",volume:1,harga:3500000}],
      "Hotel":[{nama:"Hotel 3 Malam",volume:3,harga:900000}],
      "Uang Harian":[{nama:"Uang Harian",volume:3,harga:400000}]
    },

    travel_umroh:{
      "Paket Umroh":[{nama:"Paket 9 Hari",volume:1,harga:35000000}],
      "Perlengkapan":[{nama:"Perlengkapan Umroh",volume:1,harga:2000000}]
    },

    travel_corporate:{
      "Transportasi":[{nama:"Bus Pariwisata",volume:1,harga:12000000}],
      "Hotel":[{nama:"Hotel 2 Malam",volume:2,harga:15000000}],
      "Team Building":[{nama:"Outbound Program",volume:1,harga:25000000}]
    }

  };

  data = templates[t] ? JSON.parse(JSON.stringify(templates[t])) : {};
  render();
}

/* ================= KATEGORI ================= */

function addKategori(){
  const input = document.getElementById("kategoriInput");
  let k = input.value.trim();
  if(!k) return;

  if(!data[k]) data[k] = [];
  input.value = "";
  render();
}

function deleteKategori(k){
  if(confirm("Hapus kategori ini?")){
    delete data[k];
    render();
  }
}

/* ================= ITEM ================= */

function addItem(k){
  const id = safeId(k);

  let nama = document.getElementById("nama_"+id).value;
  let volume = clean(document.getElementById("vol_"+id).value);
  let harga = clean(document.getElementById("harga_"+id).value);

  if(!nama || !volume || !harga) return;

  data[k].push({nama,volume,harga});
  render();
}

function deleteItem(k,i){
  data[k].splice(i,1);
  render();
}

function editItem(k,i,field,value){
  if(field==="nama") data[k][i].nama=value;
  if(field==="volume") data[k][i].volume=clean(value);
  if(field==="harga") data[k][i].harga=clean(value);
  render();
}

/* ================= RENDER ================= */

function render(){

  const container = document.getElementById("kategoriContainer");
  const diskonInput = document.getElementById("diskonInput");
  const marginInput = document.getElementById("marginInput");
  const ppnToggle = document.getElementById("ppnToggle");
  const summary = document.getElementById("summary");

  container.innerHTML="";
  let totalAll=0;

  Object.keys(data).forEach(k=>{

    const id = safeId(k);

    let html=`
    <div class="card">
    <button class="btn-delete-kategori" onclick="deleteKategori('${k}')">Delete</button>
    <h3>${k}</h3>

    <div class="flex">
      <input id="nama_${id}" placeholder="Nama Item">
      <input id="vol_${id}" placeholder="Volume">
      <input id="harga_${id}" placeholder="Harga">
      <button class="btn-primary" onclick="addItem('${k}')">Tambah</button>
    </div>

    <table>
    `;

    let total=0;

    data[k].forEach((it,i)=>{
      let sub = it.volume * it.harga;
      total += sub;

      html+=`
      <tr>
        <td data-label="Nama">
          <input class="edit-input"
          value="${it.nama}"
          onchange="editItem('${k}',${i},'nama',this.value)">
        </td>

        <td data-label="Volume">
          <input class="edit-input"
          value="${it.volume}"
          onchange="editItem('${k}',${i},'volume',this.value)">
        </td>

        <td data-label="Harga">
          <input class="edit-input"
          value="${it.harga}"
          onchange="editItem('${k}',${i},'harga',this.value)">
        </td>

        <td data-label="Subtotal">
          ${formatRp(sub)}
        </td>

        <td data-label="Aksi">
          <button onclick="deleteItem('${k}',${i})"
          class="btn-danger">Hapus</button>
        </td>
      </tr>
      `;
    });

    totalAll += total;

    html+=`
    </table>
    <div style="margin-top:10px;font-weight:600">
      Total ${k}: ${formatRp(total)}
    </div>
    </div>
    `;

    container.innerHTML += html;

  });

  /* ================= PERHITUNGAN ================= */

  let diskon = diskonAktif ? totalAll*(Number(diskonInput.value)/100) : 0;
  let subtotal = totalAll - diskon;
  let ppn = ppnToggle.checked ? subtotal*0.11 : 0;
  let grand = subtotal + ppn;
  let profit = profitAktif ? grand*(Number(marginInput.value)/100) : 0;

  summary.innerHTML=`
  <div>
    <div>Subtotal: ${formatRp(totalAll)}</div>
    <div>Diskon: ${formatRp(diskon)}</div>
    <div>PPN: ${formatRp(ppn)}</div>
    <div><strong>Grand Total: ${formatRp(grand)}</strong></div>
    <div style="color:#ffd60a;margin-top:6px">
      Estimasi Profit: ${formatRp(profit)}
    </div>
  </div>
  `;

  renderChart(grand,profit);
}

/* ================= CHART ================= */

function renderChart(total,profit){

  const ctx = document.getElementById("chart");

  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx,{
    type:"bar",
    data:{
      labels:["Grand Total","Profit"],
      datasets:[{
        data:[total,profit]
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      responsive:true
    }
  });
}

/* ================= EXPORT ================= */

function exportPDF(){
  html2pdf().from(document.body).save("RAB.pdf");
}

function exportExcel(){
  let wb=XLSX.utils.book_new();
  let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]];

  Object.keys(data).forEach(k=>{
    data[k].forEach(it=>{
      rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga]);
    });
  });

  let ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,"RAB");
  XLSX.writeFile(wb,"RAB.xlsx");
}

function generateLink(){
  let encoded=btoa(JSON.stringify(data));
  let url=location.origin+location.pathname+"?data="+encoded;
  document.getElementById("generatedLink").innerHTML=
    `<div class="link-box">${url}</div>`;
}

/* ================= LOAD ================= */

window.onload=function(){
  let params=new URLSearchParams(window.location.search);
  if(params.get("data")){
    data=JSON.parse(atob(params.get("data")));
  }
  render();
};

</script>
</body>
</html>
