<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB PRO 2026 - Stable</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0f172a;color:#fff;min-height:100vh}
.hidden{display:none}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:rgba(255,255,255,0.05);
border-bottom:1px solid rgba(255,255,255,0.05);
position:sticky;top:0;z-index:1000
}

.menu-btn{display:none;font-size:20px;cursor:pointer}

.dashboard{display:flex;min-height:100vh}

.sidebar{
width:260px;background:#020617;padding:20px;
border-right:1px solid rgba(255,255,255,0.05);
transition:.3s
}

.project-item{
padding:10px;background:rgba(255,255,255,0.05);
border-radius:8px;margin-bottom:8px;
cursor:pointer;font-size:13px
}

.project-item.active{background:#0ea5e9}

.main{flex:1;padding:20px;max-width:1100px;margin:auto}

.card{
background:rgba(255,255,255,0.05);
border-radius:16px;padding:20px;margin-bottom:20px
}

input{
width:100%;padding:10px;margin-top:6px;
border:none;border-radius:8px;
background:rgba(255,255,255,0.08);color:#fff
}

button{
padding:10px 14px;border:none;border-radius:8px;
cursor:pointer;font-weight:600;margin-top:8px
}

.btn-primary{background:#0ea5e9;color:#fff}
.btn-success{background:#22c55e;color:#000}
.btn-danger{background:#ef4444;color:#fff}
.btn-warning{background:#f59e0b;color:#000}
.btn-dark{background:#1e293b;color:#fff}

.table-wrapper{overflow-x:auto}

table{width:100%;margin-top:10px;border-collapse:collapse;font-size:13px;min-width:600px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.08)}

.summary{
background:rgba(255,255,255,0.08);
padding:15px;border-radius:12px;margin-top:10px
}

.login-box{
max-width:400px;margin:120px auto;
background:#020617;padding:30px;border-radius:16px
}

.watermark{
position:fixed;bottom:10px;right:10px;
font-size:12px;opacity:.4
}

@media(max-width:768px){
.menu-btn{display:block}
.sidebar{position:fixed;left:-260px;top:0;height:100%;z-index:2000}
.sidebar.active{left:0}
.dashboard{flex-direction:column}
}
</style>
</head>
<body>

<div id="loginPage">
<div class="login-box">
<h2>Login RAB PRO</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button class="btn-primary" onclick="login()">Login</button>
</div>
</div>

<div id="app" class="hidden">

<header>
<div style="display:flex;gap:10px;align-items:center">
<div class="menu-btn" onclick="toggleSidebar()">☰</div>
<h1>💎 RAB PRO Stable</h1>
</div>
<button class="btn-danger" onclick="logout()">Logout</button>
</header>

<div class="dashboard">

<div class="sidebar" id="sidebar">
<h3>Projects</h3>
<div id="projectList"></div>
<input id="newProjectName" placeholder="Project baru">
<button class="btn-primary" onclick="createProject()">Tambah</button>
<button class="btn-danger" onclick="deleteProject()">Hapus Project</button>
</div>

<div class="main">

<div class="card">
<label>Nama Project</label>
<input id="projectName" oninput="renameProject(this.value)">

<label>Tambah Kategori</label>
<input id="kategoriInput">
<button class="btn-success" onclick="addKategori()">Tambah</button>

<div id="kategoriContainer"></div>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0" oninput="updateSummary()">

<label>Margin (%)</label>
<input type="number" id="marginInput" value="20" oninput="updateSummary()">

<label>PPN (%)</label>
<input type="number" id="ppnInput" value="0" oninput="updateSummary()">

<div id="summary" class="summary"></div>

<button class="btn-warning" onclick="exportPDF()">Export PDF</button>
<button class="btn-primary" onclick="exportExcel()">Export Excel</button>

<canvas id="chart" style="margin-top:20px"></canvas>
</div>

</div>
</div>

<div class="watermark">RAB PRO 2026</div>
</div>

<script>
let projects=JSON.parse(localStorage.getItem("rab_pro")||"{}")
let currentProject=null
let chartInstance=null

function formatRp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}

function toggleSidebar(){sidebar.classList.toggle("active")}

function login(){
if(username.value==="admin"&&password.value==="123456"){
loginPage.classList.add("hidden")
app.classList.remove("hidden")
init()
}else alert("Login gagal")
}

function logout(){location.reload()}
function save(){localStorage.setItem("rab_pro",JSON.stringify(projects))}

function createProject(){
let name=newProjectName.value.trim()
if(!name)return
projects[name]={kategori:{},diskon:0,margin:20,ppn:0}
currentProject=name
save();renderProjects();render()
newProjectName.value=""
}

function deleteProject(){
if(!currentProject)return
delete projects[currentProject]
currentProject=null
save();renderProjects();render()
}

function renameProject(newName){
if(!currentProject||!newName)return
projects[newName]=projects[currentProject]
delete projects[currentProject]
currentProject=newName
save();renderProjects()
}

function renderProjects(){
projectList.innerHTML=""
Object.keys(projects).forEach(p=>{
projectList.innerHTML+=`<div class="project-item ${p===currentProject?"active":""}" onclick="selectProject('${p}')">${p}</div>`
})
}

function selectProject(p){currentProject=p;renderProjects();render()}

function addKategori(){
let k=kategoriInput.value.trim()
if(!k||!currentProject)return
projects[currentProject].kategori[k]=[]
kategoriInput.value=""
save();render()
}

function deleteKategori(k){
delete projects[currentProject].kategori[k]
save();render()
}

function addItem(k){
projects[currentProject].kategori[k].push({nama:"Item",volume:1,harga:0})
save();render()
}

function deleteItem(k,i){
projects[currentProject].kategori[k].splice(i,1)
save();render()
}

function updateItem(k,i,key,value){
if(key==="nama"){projects[currentProject].kategori[k][i][key]=value}
else{projects[currentProject].kategori[k][i][key]=Number(value.replace(/\D/g,''))||0}
save();updateSummary()
}

function render(){
if(!currentProject)return
let p=projects[currentProject]
projectName.value=currentProject
diskonInput.value=p.diskon
marginInput.value=p.margin
ppnInput.value=p.ppn

kategoriContainer.innerHTML=""
Object.keys(p.kategori).forEach(k=>{
let html=`<div class="card"><h3>${k}
<button class="btn-danger" onclick="deleteKategori('${k}')">X</button>
</h3>
<button class="btn-primary" onclick="addItem('${k}')">Tambah Item</button>
<div class="table-wrapper"><table>
<tr><th>Nama</th><th>Vol</th><th>Harga</th><th>Subtotal</th><th></th></tr>`

p.kategori[k].forEach((it,i)=>{
html+=`<tr>
<td contenteditable oninput="updateItem('${k}',${i},'nama',this.innerText)">${it.nama}</td>
<td contenteditable oninput="updateItem('${k}',${i},'volume',this.innerText)">${it.volume}</td>
<td contenteditable oninput="updateItem('${k}',${i},'harga',this.innerText)">${formatRp(it.harga)}</td>
<td>${formatRp(it.volume*it.harga)}</td>
<td><button class="btn-danger" onclick="deleteItem('${k}',${i})">X</button></td>
</tr>`
})

html+=`</table></div></div>`
kategoriContainer.innerHTML+=html
})
updateSummary()
}

function updateSummary(){
if(!currentProject)return
let p=projects[currentProject]
p.diskon=Number(diskonInput.value)||0
p.margin=Number(marginInput.value)||0
p.ppn=Number(ppnInput.value)||0

let subtotal=0
Object.values(p.kategori).forEach(arr=>{
arr.forEach(it=>subtotal+=it.volume*it.harga)
})

let disk=subtotal*(p.diskon/100)
let afterDisk=subtotal-disk
let ppnVal=afterDisk*(p.ppn/100)
let grand=afterDisk+ppnVal
let profit=grand*(p.margin/100)

summary.innerHTML=`
Subtotal: ${formatRp(subtotal)}<br>
Diskon: ${formatRp(disk)}<br>
PPN: ${formatRp(ppnVal)}<br>
<strong>Grand Total: ${formatRp(grand)}</strong><br>
Profit: ${formatRp(profit)}
`
save();renderChart(subtotal,profit)
}

function renderChart(total,profit){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(chart,{
type:"doughnut",
data:{labels:["Biaya","Profit"],datasets:[{data:[total,profit]}]},
options:{responsive:true,plugins:{legend:{labels:{color:"#fff"}}}}
})
}

function exportPDF(){html2pdf().from(document.querySelector(".main")).save(currentProject+"_RAB.pdf")}
function exportExcel(){
let wb=XLSX.utils.book_new()
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]]
let p=projects[currentProject]
Object.keys(p.kategori).forEach(k=>{
p.kategori[k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga])
})
})
let ws=XLSX.utils.aoa_to_sheet(rows)
XLSX.utils.book_append_sheet(wb,ws,"RAB")
XLSX.writeFile(wb,currentProject+"_RAB.xlsx")
}

function init(){
renderProjects()
if(Object.keys(projects).length>0){
currentProject=Object.keys(projects)[0]
}
render()
}
</script>

</body>
</html>
