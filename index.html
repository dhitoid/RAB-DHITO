<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Platinum 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
background:radial-gradient(circle at top,#1c1c1e,#000);
color:#fff;
padding:30px 15px;
}

.container{max-width:540px;margin:auto}

h1{
text-align:center;
font-size:28px;
font-weight:700;
margin-bottom:25px;
background:linear-gradient(90deg,#fff,#aaa);
-webkit-background-clip:text;
color:transparent;
}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:20px;
margin-bottom:20px;
box-shadow:0 10px 40px rgba(0,0,0,.6);
transition:.3s;
}

.card:hover{transform:translateY(-3px)}

label{
font-size:12px;
opacity:.6;
display:block;
margin:14px 0 6px;
}

input,select{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:rgba(255,255,255,0.08);
color:#fff;
font-size:14px;
outline:none;
transition:.2s;
}

input:focus,select:focus{
background:rgba(255,255,255,0.15);
}

button{
width:100%;
padding:14px;
border-radius:16px;
border:none;
font-weight:600;
margin-top:10px;
cursor:pointer;
transition:.2s;
}

button:active{transform:scale(.97)}

.btn-primary{background:#0a84ff}
.btn-success{background:#30d158;color:#000}
.btn-danger{background:#ff453a}
.btn-soft{
background:rgba(255,255,255,.1);
}

table{
width:100%;
margin-top:15px;
border-collapse:separate;
border-spacing:0 8px;
}

td{
background:rgba(255,255,255,0.05);
padding:10px;
border-radius:14px;
font-size:13px;
}

.edit-input{
background:transparent;
border:none;
color:#fff;
width:100%;
font-size:13px;
}

.summary{
margin-top:15px;
padding:15px;
border-radius:18px;
background:rgba(255,255,255,0.08);
}

canvas{margin-top:10px}
.small{font-size:12px;opacity:.6}
</style>
</head>
<body>

<div class="container">
<h1>RAB Platinum 2026</h1>

<div class="card">
<label>Nama Project</label>
<input type="text" id="projectName" oninput="saveMeta()">

<label>Pilih Template</label>
<select id="templateSelect">
<option value="">-- Pilih Template --</option>
<option value="travel_liburan">Travel Liburan</option>
<option value="travel_dinas">Travel Dinas</option>
<option value="custom">Custom</option>
</select>

<button class="btn-primary" onclick="applyTemplate()">Gunakan Template</button>

<label>Tambah Kategori</label>
<input type="text" id="kategoriInput">
<button class="btn-success" onclick="addKategori()">Tambah Kategori</button>

<div id="kategoriContainer"></div>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0" oninput="saveMeta();render()">

<label>Margin Profit (%)</label>
<input type="number" id="marginInput" value="20" oninput="saveMeta();render()">

<div id="summary" class="summary"></div>
</div>

<div class="card">
<h3>Grafik Analisa</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>
let state = {
projectName:"",
diskon:0,
margin:20,
kategori:{}
}

let chartInstance=null

/* STORAGE */
function saveAll(){
localStorage.setItem("rab_platinum_v2",JSON.stringify(state))
}
function loadAll(){
let d=localStorage.getItem("rab_platinum_v2")
if(d) state=JSON.parse(d)
}

/* FORMAT */
function clean(n){return Number(String(n).replace(/\D/g,''))||0}
function format(n){return Number(n||0).toLocaleString("id-ID")}
function rp(n){return "Rp "+format(n)}

/* META */
function saveMeta(){
state.projectName=document.getElementById("projectName").value
state.diskon=Number(document.getElementById("diskonInput").value)||0
state.margin=Number(document.getElementById("marginInput").value)||0
saveAll()
}

/* TEMPLATE */
function applyTemplate(){
let t=document.getElementById("templateSelect").value
if(!t)return

const temp={
travel_liburan:{
Transportasi:[{nama:"Tiket Pesawat",volume:1,harga:7500000}],
Hotel:[{nama:"Hotel 5 Malam",volume:5,harga:1200000}]
},
travel_dinas:{
Transportasi:[{nama:"Tiket Pesawat",volume:1,harga:3500000}]
}
}

state.kategori=temp[t]||{}
saveAll()
render()
}

/* KATEGORI */
function addKategori(){
let k=document.getElementById("kategoriInput").value.trim()
if(!k)return
if(!state.kategori[k])state.kategori[k]=[]
document.getElementById("kategoriInput").value=""
saveAll()
render()
}

/* ITEM */
function addItem(k){
let nama=document.getElementById("nama_"+k).value
let vol=clean(document.getElementById("vol_"+k).value)
let harga=clean(document.getElementById("harga_"+k).value)
if(!nama||!vol||!harga)return
state.kategori[k].push({nama,volume:vol,harga})
saveAll()
render()
}

function deleteItem(k,i){
state.kategori[k].splice(i,1)
saveAll()
render()
}

function editItem(k,i,field,val){
if(field==="nama")state.kategori[k][i].nama=val
if(field==="volume")state.kategori[k][i].volume=clean(val)
if(field==="harga")state.kategori[k][i].harga=clean(val)
saveAll()
render()
}

function formatInput(el){
el.value=format(clean(el.value))
}

/* RENDER */
function render(){
let container=document.getElementById("kategoriContainer")
container.innerHTML=""
let totalAll=0

Object.keys(state.kategori).forEach(k=>{
let total=0
let html=`<div class="card"><h3>${k}</h3>

<input id="nama_${k}" placeholder="Nama">
<input id="vol_${k}" placeholder="Volume" oninput="formatInput(this)">
<input id="harga_${k}" placeholder="Harga" oninput="formatInput(this)">
<button class="btn-soft" onclick="addItem('${k}')">Tambah Item</button>

<table>`

state.kategori[k].forEach((it,i)=>{
let sub=it.volume*it.harga
total+=sub
html+=`
<tr>
<td><input class="edit-input" value="${it.nama}" oninput="editItem('${k}',${i},'nama',this.value)"></td>
<td><input class="edit-input" value="${format(it.volume)}" oninput="formatInput(this);editItem('${k}',${i},'volume',this.value)"></td>
<td><input class="edit-input" value="${format(it.harga)}" oninput="formatInput(this);editItem('${k}',${i},'harga',this.value)"></td>
<td>${rp(sub)}</td>
<td><button class="btn-danger" onclick="deleteItem('${k}',${i})">X</button></td>
</tr>`
})

totalAll+=total
html+=`</table><div class="small">Total: ${rp(total)}</div></div>`
container.innerHTML+=html
})

let diskon=totalAll*(state.diskon/100)
let grand=totalAll-diskon
let profit=grand*(state.margin/100)

document.getElementById("summary").innerHTML=
`Subtotal: ${rp(totalAll)}<br>
Diskon: ${rp(diskon)}<br>
<b>Grand Total: ${rp(grand)}</b><br>
Profit: ${rp(profit)}`

renderChart(grand,profit)
}

/* CHART */
function renderChart(total,profit){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["Grand Total","Profit"],
datasets:[{data:[total,profit]}]
},
options:{plugins:{legend:{display:false}}}
})
}

/* INIT */
window.onload=()=>{
loadAll()
document.getElementById("projectName").value=state.projectName
document.getElementById("diskonInput").value=state.diskon
document.getElementById("marginInput").value=state.margin
render()
}
</script>
</body>
</html>
