<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem RAB Dhito</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
background:linear-gradient(135deg,#1f2937,#111827);
color:#fff;
padding:20px;
}
.container{
max-width:1100px;
margin:auto;
}
.card{
background:#ffffff;
color:#333;
padding:20px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
margin-bottom:20px;
}
h1{
text-align:center;
margin-bottom:20px;
font-weight:600;
}
select,input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ddd;
}
button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}
.btn-primary{
background:#2563eb;
color:#fff;
width:100%;
}
.btn-danger{
background:#dc2626;
color:#fff;
}
.btn-success{
background:#16a34a;
color:#fff;
width:100%;
margin-top:10px;
}
table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}
th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}
th{
background:#f3f4f6;
}
.total-box{
text-align:right;
font-size:18px;
font-weight:600;
margin-top:15px;
}
.category-title{
margin-top:20px;
font-weight:600;
}
.add-category{
margin-top:10px;
display:flex;
gap:10px;
}
.add-category input{
flex:1;
}
@media(max-width:600px){
table{font-size:12px;}
}
</style>
</head>
<body>

<div class="container">
<h1>Sistem RAB Premium</h1>

<div class="card">
<label>Pilih Kategori</label>
<select id="kategoriSelect"></select>

<label>Nama Item</label>
<input type="text" id="nama">

<label>Volume</label>
<input type="number" id="volume">

<label>Harga Satuan</label>
<input type="number" id="harga">

<button class="btn-primary" onclick="tambahItem()">Tambah Item</button>

<div class="add-category">
<input type="text" id="newKategori" placeholder="Tambah kategori baru">
<button class="btn-success" onclick="tambahKategori()">Tambah</button>
</div>
</div>

<div id="rabContainer"></div>

</div>

<script>
let rabData = JSON.parse(localStorage.getItem("rabPremium")) || {
"Properti":[],
"Usaha":[],
"Custom":[]
};

function simpan(){
localStorage.setItem("rabPremium", JSON.stringify(rabData));
}

function formatRupiah(angka){
return angka.toLocaleString("id-ID");
}

function loadKategori(){
let select = document.getElementById("kategoriSelect");
select.innerHTML="";
Object.keys(rabData).forEach(kat=>{
select.innerHTML += `<option value="${kat}">${kat}</option>`;
});
}

function tambahKategori(){
let newKat = document.getElementById("newKategori").value.trim();
if(!newKat) return alert("Isi nama kategori!");
if(rabData[newKat]) return alert("Kategori sudah ada!");

rabData[newKat]=[];
simpan();
loadKategori();
render();
document.getElementById("newKategori").value="";
}

function tambahItem(){
let kategori = document.getElementById("kategoriSelect").value;
let nama = document.getElementById("nama").value;
let volume = parseFloat(document.getElementById("volume").value);
let harga = parseFloat(document.getElementById("harga").value);

if(!nama || !volume || !harga) return alert("Lengkapi data!");

rabData[kategori].push({nama,volume,harga});
simpan();
render();

document.getElementById("nama").value="";
document.getElementById("volume").value="";
document.getElementById("harga").value="";
}

function hapusItem(kategori,index){
rabData[kategori].splice(index,1);
simpan();
render();
}

function render(){
let container = document.getElementById("rabContainer");
container.innerHTML="";

Object.keys(rabData).forEach(kat=>{
let totalKategori = 0;
let html = `
<div class="card">
<div class="category-title">${kat}</div>
<table>
<tr>
<th>No</th>
<th>Nama</th>
<th>Volume</th>
<th>Harga</th>
<th>Subtotal</th>
<th>Action</th>
</tr>
`;

rabData[kat].forEach((item,i)=>{
let subtotal = item.volume * item.harga;
totalKategori += subtotal;

html += `
<tr>
<td>${i+1}</td>
<td>${item.nama}</td>
<td>${item.volume}</td>
<td>${formatRupiah(item.harga)}</td>
<td>${formatRupiah(subtotal)}</td>
<td><button class="btn-danger" onclick="hapusItem('${kat}',${i})">Hapus</button></td>
</tr>
`;
});

html += `</table>
<div class="total-box">Total ${kat}: Rp ${formatRupiah(totalKategori)}</div>
</div>`;

container.innerHTML += html;
});
}

loadKategori();
render();
</script>

</body>
</html>
