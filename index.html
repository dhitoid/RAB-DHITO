<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Platinum Pro 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
background:linear-gradient(135deg,#0f172a,#020617);
color:#fff;
padding:20px;
min-height:100vh;
}

.container{max-width:1100px;margin:auto}

h1{
font-size:28px;
margin-bottom:20px;
font-weight:700;
background:linear-gradient(90deg,#fff,#94a3b8);
-webkit-background-clip:text;
color:transparent;
}

.grid{
display:grid;
grid-template-columns:1fr 380px;
gap:20px;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
margin-bottom:15px;
}

input,select{
width:100%;
padding:10px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:#fff;
margin-top:6px;
}

button{
padding:8px 14px;
border-radius:10px;
border:none;
cursor:pointer;
font-weight:600;
margin-top:8px;
}

.btn-primary{background:#3b82f6;color:#fff}
.btn-success{background:#22c55e;color:#000}
.btn-danger{background:#ef4444;color:#fff}
.btn-warning{background:#f59e0b;color:#000}
.btn-dark{background:#1e293b;color:#fff}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
font-size:13px;
}

th,td{
padding:8px;
text-align:left;
}

th{
opacity:.6;
font-size:12px;
}

tr{
background:rgba(255,255,255,0.04);
}

td input{
background:transparent;
border:none;
color:#fff;
width:100%;
}

.summary h3{
margin-bottom:10px;
}

.total-highlight{
font-size:20px;
font-weight:700;
margin-top:10px;
color:#22c55e;
}

canvas{margin-top:15px}

.flex{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="container">
<h1>RAB Platinum Pro 2026</h1>

<div class="grid">

<!-- LEFT -->
<div>

<div class="card">
<label>Nama Project</label>
<input id="projectName">

<label>Tambah Kategori</label>
<div class="flex">
<input id="kategoriInput">
<button class="btn-success" onclick="addKategori()">Tambah</button>
</div>
</div>

<div id="kategoriContainer"></div>

</div>

<!-- RIGHT -->
<div>

<div class="card summary">
<h3>Summary</h3>

<label>Diskon (%)</label>
<input type="number" id="diskonInput" value="0" onchange="render()">

<label>Margin (%)</label>
<input type="number" id="marginInput" value="20" onchange="render()">

<div id="summaryContent"></div>

<div class="flex">
<button class="btn-warning" onclick="exportPDF()">PDF</button>
<button class="btn-primary" onclick="exportExcel()">Excel</button>
<button class="btn-dark" onclick="generateLink()">Share</button>
</div>

<div id="generatedLink" style="margin-top:10px;font-size:12px;"></div>

<canvas id="chart"></canvas>

</div>

</div>

</div>

<script>
let data={}
let chartInstance=null

function formatRp(n){
return "Rp "+Number(n||0).toLocaleString("id-ID")
}

function saveLocal(){
localStorage.setItem("rab_data",JSON.stringify(data))
}

function loadLocal(){
let d=localStorage.getItem("rab_data")
if(d)data=JSON.parse(d)
}

function addKategori(){
let k=document.getElementById("kategoriInput").value.trim()
if(!k)return
if(!data[k])data[k]=[]
document.getElementById("kategoriInput").value=""
saveLocal()
render()
}

function deleteKategori(k){
delete data[k]
saveLocal()
render()
}

function addItem(k){
data[k].push({nama:"Item Baru",volume:1,harga:0})
saveLocal()
render()
}

function deleteItem(k,i){
data[k].splice(i,1)
saveLocal()
render()
}

function updateItem(k,i,field,value){
if(field=="volume"||field=="harga"){
data[k][i][field]=Number(value)||0
}else{
data[k][i][field]=value
}
saveLocal()
render(false)
}

function render(updateChart=true){

let container=document.getElementById("kategoriContainer")
container.innerHTML=""
let subtotal=0

Object.keys(data).forEach(k=>{
let totalKategori=0

let html=`
<div class="card">
<div class="flex" style="justify-content:space-between">
<strong>${k}</strong>
<button class="btn-danger" onclick="deleteKategori('${k}')">X</button>
</div>

<button class="btn-success" onclick="addItem('${k}')">+ Tambah Item</button>

<table>
<tr>
<th>Nama</th>
<th>Vol</th>
<th>Harga</th>
<th>Subtotal</th>
<th></th>
</tr>
`

data[k].forEach((it,i)=>{
let sub=it.volume*it.harga
totalKategori+=sub
html+=`
<tr>
<td><input value="${it.nama}" onchange="updateItem('${k}',${i},'nama',this.value)"></td>
<td><input type="number" value="${it.volume}" onchange="updateItem('${k}',${i},'volume',this.value)"></td>
<td><input type="number" value="${it.harga}" onchange="updateItem('${k}',${i},'harga',this.value)"></td>
<td>${formatRp(sub)}</td>
<td><button class="btn-danger" onclick="deleteItem('${k}',${i})">X</button></td>
</tr>
`
})

subtotal+=totalKategori

html+=`</table>
<div style="margin-top:10px;font-weight:600">Total Kategori: ${formatRp(totalKategori)}</div>
</div>`

container.innerHTML+=html
})

let diskonPersen=Number(document.getElementById("diskonInput").value)||0
let marginPersen=Number(document.getElementById("marginInput").value)||0

let diskon=subtotal*(diskonPersen/100)
let afterDiskon=subtotal-diskon
let profit=afterDiskon*(marginPersen/100)
let grandTotal=afterDiskon+profit

document.getElementById("summaryContent").innerHTML=`
Subtotal: ${formatRp(subtotal)}<br>
Diskon: ${formatRp(diskon)}<br>
Setelah Diskon: ${formatRp(afterDiskon)}<br>
Profit: ${formatRp(profit)}<br>
<div class="total-highlight">
Harga Jual: ${formatRp(grandTotal)}
</div>
`

if(updateChart)renderChart(afterDiskon,profit)
}

function renderChart(total,profit){
if(chartInstance)chartInstance.destroy()
chartInstance=new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels:["Biaya","Profit"],
datasets:[{data:[total,profit]}]
},
options:{
plugins:{legend:{labels:{color:"#fff"}}}
}
})
}

function exportPDF(){
html2pdf().from(document.body).save("RAB-Pro.pdf")
}

function exportExcel(){
let wb=XLSX.utils.book_new()
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]]
Object.keys(data).forEach(k=>{
data[k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga])
})
})
let ws=XLSX.utils.aoa_to_sheet(rows)
XLSX.utils.book_append_sheet(wb,ws,"RAB")
XLSX.writeFile(wb,"RAB-Pro.xlsx")
}

function generateLink(){
let encoded=btoa(JSON.stringify(data))
let url=location.origin+location.pathname+"?data="+encoded
document.getElementById("generatedLink").innerText=url
}

window.onload=()=>{
let p=new URLSearchParams(location.search)
if(p.get("data")){
data=JSON.parse(atob(p.get("data")))
}else{
loadLocal()
}
render()
}
</script>

</body>
</html>
