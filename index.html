<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB PRO System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:#fff;
padding:20px;
}
.container{max-width:1200px;margin:auto;}
h1{text-align:center;margin-bottom:20px;font-weight:600;}
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:20px;
border-radius:15px;
margin-bottom:20px;
}
input,select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
}
button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}
.btn-primary{background:#3b82f6;color:#fff;width:100%;}
.btn-success{background:#22c55e;color:#fff;}
.btn-danger{background:#ef4444;color:#fff;}
.btn-warning{background:#f59e0b;color:#fff;width:100%;margin-top:10px;}
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
font-size:14px;
}
th,td{
padding:8px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.2);
}
th{background:rgba(255,255,255,0.1);}
.total-box{
text-align:right;
font-weight:600;
margin-top:10px;
}
.flex{display:flex;gap:10px;}
@media(max-width:700px){
table{font-size:11px;}
.flex{flex-direction:column;}
}
</style>
</head>
<body>

<div class="container">
<h1>RAB PRO System</h1>

<div class="card">
<label>Pilih Project</label>
<select id="projectSelect" onchange="render()"></select>

<div class="flex">
<input type="text" id="newProject" placeholder="Nama Project Baru">
<button class="btn-success" onclick="addProject()">Tambah Project</button>
</div>
</div>

<div class="card">
<label>Kategori</label>
<select id="kategoriSelect"></select>

<input type="text" id="newKategori" placeholder="Tambah kategori baru">
<button class="btn-success" onclick="addKategori()">Tambah Kategori</button>

<label>Nama Item</label>
<input type="text" id="nama">

<label>Volume</label>
<input type="number" id="volume">

<label>Harga Satuan</label>
<input type="number" id="harga">

<button class="btn-primary" onclick="addItem()">Tambah Item</button>

<label style="margin-top:10px;display:block;">
<input type="checkbox" id="ppnCheck" onchange="render()"> Aktifkan PPN 11%
</label>

<button class="btn-warning" onclick="exportCSV()">Export CSV</button>
</div>

<div id="output"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("rabPro")) || {};

function save(){localStorage.setItem("rabPro",JSON.stringify(data));}

function formatRp(n){return n.toLocaleString("id-ID");}

function loadProjects(){
let select=document.getElementById("projectSelect");
select.innerHTML="";
Object.keys(data).forEach(p=>{
select.innerHTML+=`<option value="${p}">${p}</option>`;
});
if(Object.keys(data).length===0){
data["Project 1"]={};
save();
loadProjects();
}
}

function addProject(){
let name=document.getElementById("newProject").value.trim();
if(!name) return alert("Isi nama project");
if(data[name]) return alert("Sudah ada");

data[name]={};
save();
loadProjects();
document.getElementById("newProject").value="";
}

function loadKategori(){
let p=document.getElementById("projectSelect").value;
let select=document.getElementById("kategoriSelect");
select.innerHTML="";
Object.keys(data[p]).forEach(k=>{
select.innerHTML+=`<option value="${k}">${k}</option>`;
});
}

function addKategori(){
let p=document.getElementById("projectSelect").value;
let name=document.getElementById("newKategori").value.trim();
if(!name) return alert("Isi kategori");
if(!data[p]) data[p]={};
if(data[p][name]) return alert("Sudah ada");

data[p][name]=[];
save();
document.getElementById("newKategori").value="";
render();
}

function addItem(){
let p=document.getElementById("projectSelect").value;
let k=document.getElementById("kategoriSelect").value;
let nama=document.getElementById("nama").value;
let volume=parseFloat(document.getElementById("volume").value);
let harga=parseFloat(document.getElementById("harga").value);

if(!nama||!volume||!harga) return alert("Lengkapi data");

data[p][k].push({nama,volume,harga});
save();
render();

document.getElementById("nama").value="";
document.getElementById("volume").value="";
document.getElementById("harga").value="";
}

function deleteItem(p,k,i){
data[p][k].splice(i,1);
save();
render();
}

function render(){
let p=document.getElementById("projectSelect").value;
loadKategori();
let out=document.getElementById("output");
out.innerHTML="";
let grandTotal=0;

Object.keys(data[p]).forEach(k=>{
let total=0;
let html=`<div class="card"><h3>${k}</h3>
<table>
<tr><th>No</th><th>Nama</th><th>Vol</th><th>Harga</th><th>Subtotal</th><th>Action</th></tr>`;

data[p][k].forEach((item,i)=>{
let sub=item.volume*item.harga;
total+=sub;
html+=`<tr>
<td>${i+1}</td>
<td>${item.nama}</td>
<td>${item.volume}</td>
<td>${formatRp(item.harga)}</td>
<td>${formatRp(sub)}</td>
<td><button class="btn-danger" onclick="deleteItem('${p}','${k}',${i})">X</button></td>
</tr>`;
});

grandTotal+=total;
html+=`</table>
<div class="total-box">Total ${k}: Rp ${formatRp(total)}</div></div>`;
out.innerHTML+=html;
});

let ppn=0;
if(document.getElementById("ppnCheck").checked){
ppn=grandTotal*0.11;
}

out.innerHTML+=`
<div class="card">
<div class="total-box">Subtotal: Rp ${formatRp(grandTotal)}</div>
<div class="total-box">PPN 11%: Rp ${formatRp(ppn)}</div>
<div class="total-box" style="font-size:20px;">Grand Total: Rp ${formatRp(grandTotal+ppn)}</div>
</div>
`;
}

function exportCSV(){
let p=document.getElementById("projectSelect").value;
let csv="Kategori,Nama,Volume,Harga,Subtotal\n";

Object.keys(data[p]).forEach(k=>{
data[p][k].forEach(item=>{
let sub=item.volume*item.harga;
csv+=`${k},${item.nama},${item.volume},${item.harga},${sub}\n`;
});
});

let blob=new Blob([csv],{type:"text/csv"});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download=p+"_RAB.csv";
a.click();
}

loadProjects();
render();
</script>

</body>
</html>
