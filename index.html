<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB Enterprise Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:linear-gradient(180deg,#0f172a,#1e293b);color:#fff;padding:20px}
.container{max-width:1100px;margin:auto}
h1{text-align:center;margin-bottom:25px;font-weight:700}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);
border-radius:20px;padding:20px;margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.3)}
input,select{width:100%;padding:12px;border-radius:14px;border:none;
margin:6px 0;background:rgba(255,255,255,0.15);color:#fff;font-size:14px}
button{padding:10px 14px;border-radius:14px;border:none;font-weight:600;
cursor:pointer;margin:4px;transition:0.2s}
button:hover{transform:scale(1.05)}
.btn-primary{background:#3b82f6;color:#fff}
.btn-success{background:#22c55e;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-warning{background:#f59e0b;color:#fff}
.btn-dark{background:#111827;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:8px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.2)}
th{background:rgba(255,255,255,0.1)}
.total-box{text-align:right;margin-top:8px;font-weight:600}
.flex{display:flex;gap:10px;flex-wrap:wrap}
canvas{background:#fff;border-radius:15px;margin-top:15px}
@media(max-width:700px){.flex{flex-direction:column}}
</style>
</head>
<body>

<div class="container">
<h1>RAB Enterprise Pro</h1>

<div class="card" id="adminPanel">

<label>Project</label>
<select id="projectSelect" onchange="render()"></select>

<div class="flex">
<input type="text" id="newProject" placeholder="Project baru">
<button class="btn-success" onclick="addProject()">Tambah</button>
<button class="btn-danger" onclick="deleteProject()">Hapus</button>
</div>

<!-- TEMPLATE SECTION -->
<label>Gunakan Template</label>
<div class="flex">
<select id="templateSelect">
<option value="">-- Pilih Template --</option>
<option value="pembangunan">Pembangunan Rumah</option>
<option value="renovasi">Renovasi</option>
<option value="interior">Interior</option>
<option value="perjalanan">Perjalanan Dinas</option>
<option value="event">Event Organizer</option>
<option value="it">Proyek IT</option>
<option value="kuliner">Usaha Kuliner</option>
<option value="kantor">Operasional Kantor</option>
<option value="marketing">Marketing & Iklan</option>
<option value="training">Workshop / Training</option>
</select>
<button class="btn-primary" onclick="applyTemplate()">Gunakan</button>
</div>

<label>Kategori</label>
<select id="kategoriSelect"></select>

<div class="flex">
<input type="text" id="newKategori" placeholder="Kategori baru">
<button class="btn-success" onclick="addKategori()">Tambah</button>
<button class="btn-danger" onclick="deleteKategori()">Hapus</button>
</div>

<input type="text" id="nama" placeholder="Nama Item">
<input type="text" id="volume" placeholder="Volume">
<input type="text" id="harga" placeholder="Harga (Rp)">
<button class="btn-primary" onclick="addItem()">Tambah Item</button>

<label>PPN (%)</label>
<input type="number" id="ppnInput" value="11" onchange="render()">
<label style="display:flex;align-items:center;gap:8px">
<input type="checkbox" id="ppnToggle" checked onchange="render()" style="width:auto">
Aktifkan PPN
</label>

<button class="btn-warning" onclick="exportPDF()">Export PDF</button>
<button class="btn-dark" onclick="generateLink()">Generate Link Klien</button>

</div>

<div id="output"></div>

<div class="card">
<h3>Grafik Margin (20%)</h3>
<canvas id="profitChart"></canvas>
</div>

<div class="card">
<h3>Tanda Tangan Digital</h3>
<input type="text" id="ttdNama" placeholder="Disetujui oleh">
<canvas id="signature" width="400" height="200"></canvas><br>
<button class="btn-danger" onclick="clearSignature()">Clear</button>
</div>

</div>

<script>

/* ================= TEMPLATE DATA ================= */

const templates={
pembangunan:{
"Material":[
{nama:"Semen (sak)",volume:100,harga:60000},
{nama:"Batu Bata",volume:5000,harga:900},
{nama:"Pasir (m3)",volume:10,harga:250000}
],
"Tukang":[
{nama:"Tukang Harian",volume:30,harga:150000},
{nama:"Mandor",volume:30,harga:200000}
]
},

perjalanan:{
"Transportasi":[
{nama:"BBM (Liter)",volume:100,harga:15000},
{nama:"Tol",volume:5,harga:20000},
{nama:"Parkir",volume:5,harga:10000}
],
"Akomodasi":[
{nama:"Hotel (Malam)",volume:3,harga:350000},
{nama:"Makan",volume:6,harga:50000}
]
},

it:{
"Pengembangan":[
{nama:"Frontend Dev (Hari)",volume:20,harga:300000},
{nama:"Backend Dev (Hari)",volume:20,harga:350000}
],
"Server":[
{nama:"Hosting (Bulan)",volume:12,harga:150000},
{nama:"Domain (Tahun)",volume:1,harga:150000}
]
}
};

/* ================= SISTEM ASLI (TIDAK DIUBAH) ================= */

const urlParams=new URLSearchParams(window.location.search);
const clientMode=urlParams.get("client")==="1";
if(clientMode) document.getElementById("adminPanel").style.display="none";

let data=JSON.parse(localStorage.getItem("rabEnterprise"))||{};
let chartInstance=null;

function save(){localStorage.setItem("rabEnterprise",JSON.stringify(data))}
function formatRp(n){return "Rp "+Number(n).toLocaleString("id-ID")}
function cleanNumber(v){return Number(String(v).replace(/\D/g,''))}

function loadProjects(){
let sel=projectSelect; sel.innerHTML="";
Object.keys(data).forEach(p=>sel.innerHTML+=`<option>${p}</option>`);
if(Object.keys(data).length===0){
data["Project 1"]={}; save(); loadProjects();
}
}

function addProject(){
let n=newProject.value.trim();
if(!n)return;
data[n]={}; save(); loadProjects(); render();
}

function deleteProject(){
let p=projectSelect.value;
if(confirm("Hapus project ini?")){
delete data[p]; save(); loadProjects(); render();
}
}

/* ================= TEMPLATE FUNCTION ================= */

function applyTemplate(){
let p=projectSelect.value;
let t=templateSelect.value;
if(!t)return alert("Pilih template dulu");

data[p]=JSON.parse(JSON.stringify(templates[t]));
save();
render();
}

/* ================= RENDER & LOGIC ================= */

function loadKategori(){
let p=projectSelect.value;
kategoriSelect.innerHTML="";
Object.keys(data[p]||{}).forEach(k=>kategoriSelect.innerHTML+=`<option>${k}</option>`);
}

function addKategori(){
let p=projectSelect.value;
let k=newKategori.value.trim();
if(!k)return;
if(!data[p])data[p]={};
data[p][k]=[]; save(); render();
}

function deleteKategori(){
let p=projectSelect.value;
let k=kategoriSelect.value;
if(confirm("Hapus kategori ini?")){
delete data[p][k]; save(); render();
}
}

function addItem(){
let p=projectSelect.value;
let k=kategoriSelect.value;
if(!k)return alert("Pilih kategori dulu");
let item={nama:nama.value,volume:cleanNumber(volume.value),harga:cleanNumber(harga.value)};
if(!item.nama||!item.volume||!item.harga)return;
data[p][k].push(item);
save(); render();
nama.value=""; volume.value=""; harga.value="";
}

function render(){
loadKategori();
let p=projectSelect.value;
let out=output; out.innerHTML="";
let totalAll=0;

Object.keys(data[p]||{}).forEach(k=>{
let total=0;
let html=`<div class="card"><h3>${k}</h3><table>
<tr><th>No</th><th>Nama</th><th>Vol</th><th>Harga</th><th>Subtotal</th></tr>`;

data[p][k].forEach((it,i)=>{
let sub=it.volume*it.harga; total+=sub;
html+=`<tr>
<td>${i+1}</td>
<td>${it.nama}</td>
<td>${it.volume}</td>
<td>${formatRp(it.harga)}</td>
<td>${formatRp(sub)}</td>
</tr>`;
});

totalAll+=total;
html+=`</table><div class="total-box">Total: ${formatRp(total)}</div></div>`;
out.innerHTML+=html;
});

let ppnAktif=ppnToggle.checked;
let ppnPersen=Number(ppnInput.value)||0;
let ppn=ppnAktif? totalAll*(ppnPersen/100):0;
let grand=totalAll+ppn;

out.innerHTML+=`
<div class="card">
<div class="total-box">Subtotal: ${formatRp(totalAll)}</div>
<div class="total-box">PPN: ${formatRp(ppn)}</div>
<div class="total-box" style="font-size:20px">Grand Total: ${formatRp(grand)}</div>
</div>`;

renderChart(totalAll);
}

function renderChart(total){
if(chartInstance) chartInstance.destroy();
chartInstance=new Chart(profitChart,{
type:'bar',
data:{labels:['Modal','Margin 20%'],
datasets:[{data:[total,total*0.2]}]},
options:{plugins:{legend:{display:false}}}
});
}

/* SIGNATURE tetap */
let canvas=signature;
let ctx=canvas.getContext("2d");
ctx.lineWidth=2; ctx.lineCap="round";
let drawing=false;
function getPos(e){
let rect=canvas.getBoundingClientRect();
if(e.touches){
return{x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top}
}else{
return{x:e.clientX-rect.left,y:e.clientY-rect.top}
}}
canvas.addEventListener("mousedown",()=>drawing=true);
canvas.addEventListener("mouseup",()=>{drawing=false;ctx.beginPath();});
canvas.addEventListener("mousemove",(e)=>{
if(!drawing)return;
let pos=getPos(e);
ctx.lineTo(pos.x,pos.y); ctx.stroke();
ctx.beginPath(); ctx.moveTo(pos.x,pos.y);
});
canvas.addEventListener("touchstart",()=>drawing=true);
canvas.addEventListener("touchend",()=>{drawing=false;ctx.beginPath();});
canvas.addEventListener("touchmove",(e)=>{
e.preventDefault();
if(!drawing)return;
let pos=getPos(e);
ctx.lineTo(pos.x,pos.y); ctx.stroke();
ctx.beginPath(); ctx.moveTo(pos.x,pos.y);
});
function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height)}

loadProjects();
render();

</script>

</body>
</html>
