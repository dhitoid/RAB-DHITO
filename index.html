<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAB PRO 2026 - Commercial</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:#fff;
min-height:100vh;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 30px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.08);
}

h1{font-size:20px;font-weight:600}

/* LAYOUT */
.wrapper{
display:flex;
max-width:1600px;
margin:auto;
padding:25px;
gap:25px;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:20px;
height:fit-content;
}

.project-item{
padding:10px;
border-radius:10px;
margin-bottom:8px;
cursor:pointer;
font-size:13px;
background:rgba(255,255,255,.06);
transition:.2s;
}

.project-item.active{
background:#0ea5e9;
}

.project-item:hover{
background:rgba(255,255,255,.12);
}

/* MAIN */
.main{
flex:1;
}

.card{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:25px;
margin-bottom:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

/* BUTTON */
button{
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:.2s;
}

.btn-primary{background:#0ea5e9;color:#fff}
.btn-success{background:#22c55e;color:#000}
.btn-danger{background:#ef4444;color:#fff}
.btn-warning{background:#f59e0b;color:#000}

button:hover{opacity:.85}

/* INPUT */
input{
width:100%;
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.1);
color:#fff;
padding:8px;
border-radius:8px;
outline:none;
}

input:focus{border-color:#0ea5e9}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
text-align:left;
padding:12px;
font-size:13px;
background:rgba(255,255,255,.07);
}

td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,.06);
}

.table-wrap{overflow-x:auto}

/* SUMMARY */
.summary{
margin-top:20px;
padding:20px;
background:rgba(255,255,255,.07);
border-radius:15px;
line-height:1.8;
font-size:14px;
}

.summary strong{
font-size:18px;
color:#22c55e;
}

/* MOBILE */
@media(max-width:900px){
.wrapper{flex-direction:column}
.sidebar{width:100%}
}
</style>
</head>
<body>

<header>
<h1>💎 RAB PRO 2026 - Commercial</h1>
</header>

<div class="wrapper">

<!-- SIDEBAR -->
<div class="sidebar">
<h3 style="margin-bottom:10px">Projects</h3>
<div id="projectList"></div>

<input id="newProject" placeholder="Nama Project">
<button class="btn-primary" style="margin-top:10px;width:100%" onclick="createProject()">Tambah</button>
<button class="btn-danger" style="margin-top:8px;width:100%" onclick="deleteProject()">Hapus</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="card">
<label>Nama Project</label>
<input id="projectName" onblur="renameProject()">

<div style="margin-top:15px">
<label>Tambah Kategori</label>
<input id="newKategori">
<button class="btn-success" style="margin-top:8px" onclick="addKategori()">Tambah Kategori</button>
</div>

<div id="kategoriContainer"></div>

<h3 style="margin-top:20px">Pengaturan</h3>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin-top:10px">
<div>
<label>Diskon %</label>
<input type="number" id="diskon" oninput="updateSummary()">
</div>
<div>
<label>Margin %</label>
<input type="number" id="margin" oninput="updateSummary()">
</div>
<div>
<label>PPN %</label>
<input type="number" id="ppn" oninput="updateSummary()">
</div>
</div>

<div class="summary" id="summary"></div>

<button class="btn-warning" onclick="exportExcel()">Export Excel</button>

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>
</div>

<script>

/* ================= DATA ================= */
let projects = JSON.parse(localStorage.getItem("rab_pro_data") || "{}")
let currentProject = localStorage.getItem("rab_pro_current") || null
let chartInstance=null

function save(){
localStorage.setItem("rab_pro_data",JSON.stringify(projects))
localStorage.setItem("rab_pro_current",currentProject||"")
}

/* ================= FORMAT ================= */
function formatRp(val){
return new Intl.NumberFormat("id-ID").format(val)
}

function parseNumber(val){
return Number(val.replace(/\D/g,""))||0
}

/* ================= PROJECT ================= */
function createProject(){
let name=newProject.value.trim()
if(!name || projects[name]) return
projects[name]={
kategori:{},
diskon:0,
margin:20,
ppn:0
}
currentProject=name
newProject.value=""
save()
renderProjects()
render()
}

function deleteProject(){
if(!currentProject) return
delete projects[currentProject]
currentProject=null
save()
renderProjects()
render()
}

function renameProject(){
let val=projectName.value.trim()
if(!val || val===currentProject) return
if(projects[val]) return alert("Nama sudah ada")
projects[val]=projects[currentProject]
delete projects[currentProject]
currentProject=val
save()
renderProjects()
}

function selectProject(p){
currentProject=p
save()
renderProjects()
render()
}

function renderProjects(){
projectList.innerHTML=""
Object.keys(projects).forEach(p=>{
projectList.innerHTML+=`
<div class="project-item ${p===currentProject?"active":""}" onclick="selectProject('${p}')">${p}</div>
`
})
}

/* ================= KATEGORI ================= */
function addKategori(){
let k=newKategori.value.trim()
if(!k || !currentProject) return
projects[currentProject].kategori[k]=[]
newKategori.value=""
save()
render()
}

function deleteKategori(k){
delete projects[currentProject].kategori[k]
save()
render()
}

/* ================= ITEM ================= */
function addItem(k){
projects[currentProject].kategori[k].push({nama:"Item Baru",volume:1,harga:0})
save()
render()
}

function removeItem(k,i){
projects[currentProject].kategori[k].splice(i,1)
save()
render()
}

function updateItem(k,i,key,val){
if(key==="volume") projects[currentProject].kategori[k][i][key]=Number(val)||0
else projects[currentProject].kategori[k][i][key]=val
updateSummary()
save()
}

function updateHarga(k,i,input){
let number=parseNumber(input.value)
projects[currentProject].kategori[k][i].harga=number
input.value=formatRp(number)
updateSummary()
save()
}

/* ================= RENDER ================= */
function render(){
if(!currentProject) return

let p=projects[currentProject]
projectName.value=currentProject
diskon.value=p.diskon
margin.value=p.margin
ppn.value=p.ppn

kategoriContainer.innerHTML=""

Object.keys(p.kategori).forEach(k=>{
let html=`
<div class="card">
<h3>${k} 
<button class="btn-danger" onclick="deleteKategori('${k}')">X</button>
</h3>

<div class="table-wrap">
<table>
<tr>
<th>Nama</th>
<th>Volume</th>
<th>Harga</th>
<th>Subtotal</th>
<th></th>
</tr>
`

p.kategori[k].forEach((it,i)=>{
html+=`
<tr>
<td><input value="${it.nama}" oninput="updateItem('${k}',${i},'nama',this.value)"></td>
<td><input type="number" value="${it.volume}" oninput="updateItem('${k}',${i},'volume',this.value)"></td>
<td><input value="${formatRp(it.harga)}" oninput="updateHarga('${k}',${i},this)"></td>
<td>Rp ${formatRp(it.volume*it.harga)}</td>
<td><button class="btn-danger" onclick="removeItem('${k}',${i})">X</button></td>
</tr>
`
})

html+=`</table>
<button class="btn-success" style="margin-top:10px" onclick="addItem('${k}')">+ Item</button>
</div>
</div>
`
kategoriContainer.innerHTML+=html
})

updateSummary()
}

/* ================= SUMMARY ================= */
function updateSummary(){
if(!currentProject) return
let p=projects[currentProject]

p.diskon=Number(diskon.value)||0
p.margin=Number(margin.value)||0
p.ppn=Number(ppn.value)||0

let subtotal=0
Object.values(p.kategori).forEach(arr=>{
arr.forEach(it=>subtotal+=it.volume*it.harga)
})

let disk=subtotal*(p.diskon/100)
let afterDisk=subtotal-disk
let ppnVal=afterDisk*(p.ppn/100)
let grand=afterDisk+ppnVal
let profit=grand*(p.margin/100)

summary.innerHTML=`
<div>Subtotal : Rp ${formatRp(subtotal)}</div>
<div>Diskon : Rp ${formatRp(disk)}</div>
<div>PPN : Rp ${formatRp(ppnVal)}</div>
<hr style="margin:10px 0;border:0;border-top:1px solid rgba(255,255,255,.2)">
<strong>Grand Total : Rp ${formatRp(grand)}</strong>
<div style="color:#22c55e;margin-top:5px">Estimasi Profit : Rp ${formatRp(profit)}</div>
`

renderChart(subtotal,profit)
save()
}

/* ================= CHART ================= */
function renderChart(total,profit){
if(chartInstance) chartInstance.destroy()
chartInstance=new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels:["Biaya","Profit"],
datasets:[{data:[total,profit]}]
},
options:{responsive:true}
})
}

/* ================= EXPORT ================= */
function exportExcel(){
let wb=XLSX.utils.book_new()
let rows=[["Kategori","Nama","Volume","Harga","Subtotal"]]
let p=projects[currentProject]

Object.keys(p.kategori).forEach(k=>{
p.kategori[k].forEach(it=>{
rows.push([k,it.nama,it.volume,it.harga,it.volume*it.harga])
})
})

let ws=XLSX.utils.aoa_to_sheet(rows)
XLSX.utils.book_append_sheet(wb,ws,"RAB")
XLSX.writeFile(wb,currentProject+"_RAB.xlsx")
}

/* ================= INIT ================= */
renderProjects()
if(!currentProject && Object.keys(projects).length>0){
currentProject=Object.keys(projects)[0]
}
render()

</script>
</body>
</html>
